// 表情包预览不需要重挂载：选图、改字只做局部 DOM 更新，避免整页重绘
function syncMeme(){
  var img = $('#memeImg'), txt = $('#memeTxt');
  if (img) img.src = 'assets/' + meme.photo + '.jpg';
  if (txt){ txt.textContent = meme.text; txt.className = 'meme-txt ' + meme.pos; }
  $$('.picker button').forEach(function(b){ b.classList.toggle('on', b.dataset.id === meme.photo); });
  $$('.chip').forEach(function(c){ c.classList.toggle('on', c.dataset.t === meme.text); });
}

function makeMeme(){
  if (P.coins < 5){ toast('鱼干不够，去签到或撸猫赚一点'); return; }
  var id = meme.photo, text = meme.text, pos = meme.pos;
  var im = new Image();
  im.onload = function(){
    // 先确认底图真的加载出来了再扣钱：加载失败时不能白扣鱼干
    if (!spendCoin(5)) return;
    var W = 750, H = 1000;
    var cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    var ctx = cv.getContext('2d');
    // cover 绘制
    var s = Math.max(W / im.width, H / im.height);
    var dw = im.width * s, dh = im.height * s;
    ctx.drawImage(im, (W - dw) / 2, (H - dh) / 2, dw, dh);
    // 文字：白字 + 黑描边
    var size = Math.max(34, Math.min(76, Math.floor(W * 1.72 / Math.max(4, text.length))));
    ctx.font = '900 ' + size + 'px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(6, size * 0.16);
    ctx.strokeStyle = '#000';
    ctx.fillStyle = '#fff';
    var y = (pos === 'top') ? size * 1.1 : H - size * 1.1;
    ctx.strokeText(text, W / 2, y);
    ctx.fillText(text, W / 2, y);
    var url = cv.toDataURL('image/jpeg', 0.92);
    S.memes++; save();
    var out = $('#memeOut');
    if (out){
      out.innerHTML = '<div class="sec-t"><span>生成好了</span></div>'
        + '<div class="card" style="text-align:center">'
        + '<img src="' + url + '" style="border-radius:11px;margin:0 auto;max-height:340px;width:auto" alt="表情包">'
        + '<div class="tiny" style="margin-top:10px">长按图片保存到相册 · 或点下面的按钮下载</div>'
        + '<a class="btn ghost" style="margin-top:11px;text-decoration:none" href="' + url + '" download="jzca-' + id + '.jpg">下载图片</a>'
        + '</div>';
      out.scrollIntoView({behavior:'smooth', block:'nearest'});
    }
    vibe(16);
    toast('生成成功 · 已扣 5 鱼干');
  };
  im.onerror = function(){ toast('底图加载失败，换一张再试'); };
  im.src = 'assets/' + id + '.jpg';
}

/* 网格 HTML 抽成独立函数，是因为"抽完一张只重画网格"需要它：
   整页 render 会把下面那个"抽到了"的结果卡一起冲掉，用户就看不到自己抽到什么了。 */
/* 图鉴筛选：稀有度 + 姿态，让"数据库"能翻、能查，而不是一长串平铺 */
var albumFilter = { r: 'all', cat: 'all' };
function albumFilteredPool(){
  return cardPool().filter(function(p){
    if (albumFilter.r !== 'all' && p.r !== albumFilter.r) return false;
    if (albumFilter.cat !== 'all' && p.cat !== albumFilter.cat) return false;
    return true;
  });
}
function albumGridHTML(){
  var h = '';
  albumFilteredPool().forEach(function(p){
    var has = S.album.unlocked.indexOf(p.id) >= 0;
    var isNew = S.album.fresh.indexOf(p.id) >= 0;
    h += '<div class="alb' + (has ? '' : ' lock') + (isNew ? ' new' : '') + '" data-act="cardOpen" data-id="' + esc(p.id) + '">';
    h +=   '<img src="' + esc(imgOf(p)) + '" alt="" loading="lazy">';
    h +=   '<span class="rk ' + p.r.toLowerCase() + '">' + p.r + '</span>';
    if (p.community) h += '<span class="up">投稿</span>';
    if (!has) h += '<span class="lockmark">🔒</span>';
    h +=   '<span class="nm">' + (has ? esc(p.n) : '未收集') + '</span>';
    h += '</div>';
  });
  return h;
}
// 已收集必须从卡池里筛出来算，不能直接数 unlocked 的长度：
// 卡池里的卡是会被删掉的（比如某张投稿被否了），直接数就会出现 18/17 这种分子大于分母的怪数
function albumGot(pool){ return pool.filter(function(p){ return S.album.unlocked.indexOf(p.id) >= 0; }).length; }
function albumProgressHTML(pool){

function rollRarity(){
  var roll = Math.random() * 100, acc = 0, order = ['SSR', 'SR', 'R', 'N'];
  for (var i = 0; i < order.length; i++){
    acc += RARITY_W[order[i]];
    if (roll < acc) return order[i];
  }
  return 'N';
}
// 抽一次。**从整个卡池抽**，不再只从"还没收集的"里面挑 ——
// 用户要的"抽到重复返还三分之一"必须建立在"抽得到重复"这个前提上，
// 原来的实现永远抽不到重复，这条规则就永远不会触发。
// ⚠️ 这里**只改图鉴状态，不碰鱼干**。钱的进出统一由调用方结算：
//    之前把返还写在函数里，十连那边又结算了一次，重复的每张退了两次 ——
//    实测抓到的（十连应该退 20，实际退了 40）。钱的事只留一个记账口子。
function drawOnce(){
  var pool = cardPool();
  if (!pool.length) return null;
  var rar = rollRarity();
  var cand = pool.filter(function(p){ return p.r === rar; });
  if (!cand.length) cand = pool;
  var got = pick(cand);
  var dup = S.album.unlocked.indexOf(got.id) >= 0;
  if (!dup) unlock(got.id);
  return { card: got, dup: dup };
}

function paintDrawResult(list, cost, refund){
  var out = $('#drawOut');
  if (!out) return;
  var news = list.filter(function(x){ return !x.dup; });
  var dups = list.length - news.length;
  var h = '';
  if (list.length === 1){
    var r = list[0];
    h += '<div class="sec-t"><span>抽到了</span></div>';
    h += '<div class="draw-card' + (r.dup ? ' dup' : '') + '">'
      + '<img src="' + esc(imgOf(r.card)) + '" alt="">'
      + '<div class="dc-b"><div class="r">' + r.card.r + (r.dup ? ' · 已经有了' : '') + '</div>'
      + '<div class="n">' + esc(r.card.n) + '</div>'
      + '<div class="d">' + (r.dup ? ('这张重复了，返还 ' + DUP_REFUND + ' 鱼干') : esc(r.card.d)) + '</div>'
      + '</div></div>';
  } else {
    h += '<div class="sec-t"><span>十连结果</span></div>';
    h += '<div class="card">';
    h +=   '<div class="batch-sum">新收集 <b>' + news.length + '</b> 张 · 重复 <b>' + dups
         + '</b> 张 · 返还 <b>' + refund + '</b> 鱼干</div>';
    h +=   '<div class="batch-grid">';
    list.forEach(function(x){
      h += '<div class="bg-item' + (x.dup ? ' dup' : '') + '">'
        + '<img src="' + esc(imgOf(x.card)) + '" alt="" loading="lazy">'
        + '<span class="bg-r">' + x.card.r + '</span>'
        + (x.dup ? '<span class="bg-dup">重复</span>' : '')
        + '</div>';
    });
    h +=   '</div>';
    h +=   '<div class="tiny" style="margin-top:10px">十连花了 ' + cost + ' 鱼干；重复的每张返 '
         + DUP_REFUND + '，这次共返 ' + refund + '。</div>';
    h += '</div>';
  }
  h += '<div style="height:14px"></div>';
  out.innerHTML = h;
}

function drawCard(){
  if (!cardPool().length){ toast('卡池是空的'); return; }
  if (!spendCoin(DRAW_COST)) return;
  var r = drawOnce();
  if (!r){ P.coins += DRAW_COST; save(); toast('卡池是空的，钱退给你了'); return; }  // 兜底：别把钱吞了
  // 重复返还三分之一。退款恒小于单抽成本，所以"反复抽重复刷鱼干"这条路不存在
  var refund = r.dup ? DUP_REFUND : 0;
  P.coins += refund;
  S.draws++;
  save();
  vibe([10, 26, 10]);
  sfx('draw');
  paintDrawResult([r], DRAW_COST, refund);
  paintAlbum();
}

function drawBatch(){
  if (!SHARED){ toast('十连要在共享版里用'); return; }
  if (P.level < BATCH_DRAW_LEVEL){
    toast('Lv.' + BATCH_DRAW_LEVEL + ' 才能十连，你现在是 Lv.' + P.level);
    return;
  }
  if (!cardPool().length){ toast('卡池是空的'); return; }
  var cost = DRAW_COST * BATCH_N;
  if (!spendCoin(cost)) return;
  var list = [], i;
  for (i = 0; i < BATCH_N; i++){ var r = drawOnce(); if (r) list.push(r); }
  var dups = 0;
  list.forEach(function(x){ if (x.dup) dups++; });
  // 只有这里结算一次钱：没抽满的按单价退回，重复的每张退三分之一
  var refund = (BATCH_N - list.length) * DRAW_COST + dups * DUP_REFUND;
  P.coins += refund;
  S.draws += list.length;
  save();
  vibe([10, 26, 10]);
  sfx('draw');
  paintDrawResult(list, cost, refund);
  paintAlbum();
}

  h +=   '<div style="font-size:12.5px;font-weight:700;margin-bottom:6px">关于这个版本</div>';
  h +=   '<div class="tiny">'
    + (SHARED
        ? '共享版：投票、帖子、评论、排行榜都在同一个服务端上，所有人看到的是同一份。<br>'
          + '但你的鱼干、图鉴进度、连签天数仍然只存在这台手机上 —— 那些是你自己的，别人看不到。'
        : '本机版：所有数据都存在你这台手机上，没有服务器，所以发帖、评论、天台都还没有真实功能。<br>'
          + '带"演示数据"标记的内容是刻意保留的，不想让你误以为真的有人在用。')
    + '</div>';
  h += '</div>';
  return h;
}

// 排行榜。共享模式下是全画室的榜；本机模式只有你自己，那就直说"凑不出第二个人"，
// 而不是造几个假名字来撑场面。
function viewRank(){
  var h = '<div class="sec-t"><span>好感度排行</span></div>';
  if (!SHARED){
    return h + '<div class="card"><div class="muted" style="font-size:13px;line-height:1.78">'
      + '本机模式没有服务端，排行榜上凑不出第二个人。<br>'
      + '扫码进入共享版以后，这里会显示全画室的好感度排名。</div></div>';
  }
  var rows = remote.board;
  if (!rows) return h + '<div class="card"><div class="tiny" style="padding:6px 0">正在加载…</div></div>';
  if (!rows.length){
    return h + '<div class="card"><div class="muted" style="font-size:13px">还没有人上来过。撸两下猫就能上榜。</div></div>';
  }

  var TOP = 10, myIdx = -1, i;
  for (i = 0; i < rows.length; i++){ if (rows[i].uid === UID){ myIdx = i; break; } }

  function rankHTML(r, idx){
    var me = (r.uid === UID);
    var dep = DEPT_BY_ID[r.dept] ? DEPT_BY_ID[r.dept].n : '';
    return '<div class="rank">'
      + '<div class="no' + (idx < 3 ? ' top' : '') + '">' + (idx + 1) + '</div>'
      + '<div class="nm' + (me ? ' me' : '') + '">' + esc(r.nickname || '匿名员工') + (me ? '（你）' : '')
      +   '<div class="sub">' + esc(dep) + ' · Lv.' + (r.level || 1) + '</div></div>'
      + '<div class="sc">' + (r.affection || 0) + '</div>'
      + '</div>';
  }

  var body = rows.slice(0, TOP).map(rankHTML).join('');
  // 我不在前十也要看到自己 —— 排行榜的意义是知道自己排第几，不是只看别人
  if (myIdx >= TOP) body += '<div class="hr"></div>' + rankHTML(rows[myIdx], myIdx);

  return h + '<div class="card" style="padding:6px 16px">' + body + '</div>'
    + '<div class="tiny" style="margin-top:9px">按好感度排。好感度靠撸猫、投喂和每天戳它积累。</div>';
}
function row(l, v, d){
  return '<div class="row"><div><div class="rl">' + l + '</div>' + (d ? '<div class="rd">' + d + '</div>' : '') + '</div><div class="rv">' + v + '</div></div>';
}

function idTap(){
  P.exportClicks++;
  save();
  if (P.exportClicks >= 5){
    openSheet(
      '<div class="sheet-title">数据管理</div>'
      + '<div class="sheet-sub">这里可以把你手机上攒的所有数据导出成一个文件，或者从文件恢复。换手机、清缓存前建议先导出。</div>'
      + '<button class="btn" id="doExport">导出数据（JSON）</button>'
      + '<div style="height:9px"></div>'
      + '<button class="btn ghost" id="doImport">从文件恢复</button>'
      + '<div style="height:14px"></div>'
      + '<div class="tiny">导出内容包括：工牌信息、图鉴进度、签到记录、鱼干、投票记录。不含任何照片文件。</div>'
    );
    setTimeout(function(){
      var e = $('#doExport'), i = $('#doImport');
      if (e) e.addEventListener('click', doExport);
      if (i) i.addEventListener('click', doImport);
    }, 30);
  } else {
    toast('再点 ' + (5 - P.exportClicks) + ' 下');
  }
}
function doExport(){
  var data = { app:'jzca', version:1, exportedAt:new Date().toISOString(), profile:P, state:S };
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'jzca-backup-' + today() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  toast('已导出，请保存好这个文件');
}
function doImport(){
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.style.display = 'none';
  inp.onchange = function(){
    var f = inp.files[0];
    inp.remove();
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      try {
        var d = JSON.parse(fr.result);
        if (!d || d.app !== 'jzca') throw new Error('bad');
        // 备份可能来自旧版本或被手工改过，一律过归一化补齐字段，避免残缺数据把页面搞崩
        P = normalizeProfile(d.profile);
        S = normalizeState(d.state);
        save(); closeSheet(); render();
        toast('恢复成功');
      } catch(e){ toast('这个文件不是本站导出的备份'); }
    };
    fr.readAsText(f);
  };
  // 挂在 DOM 上再 click：部分浏览器对内联（脱离文档）的 file input 不弹选择框
  document.body.appendChild(inp);
  inp.click();
}

function rename(){
  openSheet(
    '<div class="sheet-title">改个署名</div>'
    + '<div class="sheet-sub">会显示在工牌上，也是同事在共享区看到的名字。不填就用「员工 + 工牌尾号」。</div>'
    + '<input class="txt" id="nameInput" maxlength="8" placeholder="最多 8 个字" value="' + esc(P.nickname) + '">'
    + '<div style="height:12px"></div>'
    + '<button class="btn" id="nameOk">保存</button>'
  );
  setTimeout(function(){
    var i = $('#nameInput'), b = $('#nameOk');
    if (i) i.focus();
    if (b) b.addEventListener('click', function(){
      P.nickname = ($('#nameInput').value || '').trim();
      save(); closeSheet(); render(); toast('已保存');
    });
  }, 30);
}
function reassign(){
  var h = '<div class="sheet-title">申请调岗</div><div class="sheet-sub">换一个部门，看到的内容不一样。</div>';
  DEPTS.forEach(function(d){
    if (!d.open) return;
    h += '<button class="row" data-act="setDept" data-id="' + d.id + '">'
      + '<div style="display:flex;align-items:center;gap:11px">'
      + '<span style="font-size:19px">' + d.ic + '</span>'
      + '<span><span class="rl" style="display:block">' + d.n + '</span><span class="rd">' + d.rl + '</span></span>'
      + '</div>'
      + '<span class="rv">' + (d.id === P.dept ? '当前' : '选这个') + '</span></button>';
  });
  openSheet(h);
}

/* ---------------------------------------------------------------
   11b. 卡池投稿与群众审核
   --------------------------------------------------------------- */
var cardDraft = null;   // { data: base64（不含 data: 前缀）, preview: dataURL }

// 把用户选的图先压到最长边 1000、JPEG q82 再传。
// 手机原图 3~8MB，直接传又慢又占服务器 —— 而且压缩在浏览器里做，
// 不用把大图先传上来再让服务端处理。
function compressImage(img){
  var MAX = 1000;
  var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  if (!w || !h) return null;
  var sc = Math.min(1, MAX / Math.max(w, h));
  var cw = Math.max(1, Math.round(w * sc)), ch = Math.max(1, Math.round(h * sc));
  var c = document.createElement('canvas');
  c.width = cw; c.height = ch;
  c.getContext('2d').drawImage(img, 0, 0, cw, ch);
  try { return c.toDataURL('image/jpeg', 0.82); } catch (e) { return null; }
}

function openCardSubmit(){
  if (!SHARED){ toast('本机模式不能投稿，扫码进来的版本才行'); return; }
  if (P.level < CARD_UPLOAD_LEVEL){
    toast('要到 Lv.' + CARD_UPLOAD_LEVEL + ' 才能投稿');
    return;
  }
  if ((remote.pending || []).some(function(c){ return c.uid === UID; })){
    toast('你上一张还在等投票');
    return;
  }
  // 不加 capture，让用户自己选用相机拍还是从相册挑
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.style.display = 'none';
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    inp.remove();
    if (f) readCardFile(f);
  };
  document.body.appendChild(inp);
  inp.click();
}

function readCardFile(file){
  // 用例：用户挑了个"改过扩展名的东西"或者 HEIC。
  // 这里先粗筛一道，真正的把关在服务端（看文件头），两边都做才拦得住。
  if (String(file.type || '').indexOf('image/') !== 0 && !/\.(jpe?g|png|webp)$/i.test(file.name || '')){
    toast('这个不是图片文件');
    return;
  }
  var fr = new FileReader();
  fr.onerror = function(){ toast('读这个文件失败了，换一张试试'); };
  fr.onload = function(){
    var img = new Image();
    img.onerror = function(){ toast('这张图打不开（可能是 HEIC 或文件坏了），可以先截图再传'); };
    img.onload = function(){
      var url = compressImage(img);
      if (!url){ toast('这张图处理不了，换一张试试'); return; }
      cardDraft = { data: url.split(',')[1], preview: url };
      openSheet(
        '<div class="sheet-title">投稿一张猫片</div>'
        + '<div class="sheet-sub">传上去先进入「待大家验证」，不是马上进卡池。名字、描述、姿态、稀有度都由你定。</div>'
        + '<img class="draft" src="' + esc(url) + '" alt="">'
        + '<label class="lbl">名字（12 字内）</label>'
        + '<input class="txt" id="cardName" maxlength="12" placeholder="给它起个名字">'
        + '<label class="lbl">一句话描述（60 字内，可选）</label>'
        + '<input class="txt" id="cardDesc" maxlength="60" placeholder="比如：它今天霸占了整张办公桌">'
        + '<label class="lbl">姿态</label>'
        + '<select class="txt" id="cardCat">'
        + CAT_ORDER.map(function(c){ return '<option value="' + c + '"' + (c === 'face' ? ' selected' : '') + '>' + PHOTO_CATS[c] + '</option>'; }).join('')
        + '</select>'
        + '<label class="lbl">稀有度（决定抽卡权重，SSR 不开放）</label>'
        + '<select class="txt" id="cardR">'
        + CARD_RARITY_OPTIONS.map(function(r){ return '<option value="' + r + '"' + (r === CARD_RARITY_DEFAULT ? ' selected' : '') + '>' + r + '</option>'; }).join('')
        + '</select>'
        + '<div style="height:12px"></div>'
        + '<button class="btn" id="cardSend">提交，等大家投票</button>'
        + '<div class="tiny" style="margin-top:11px">只收猫的照片。出现真人、跟画室无关的东西，'
        + '会被大家投掉 —— 投掉之后这张图会从服务器删掉，不留档。</div>'
      );
      var b = $('#cardSend');
      if (b) b.addEventListener('click', sendCardSubmit);
      var n = $('#cardName');
      if (n) n.focus();
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

function sendCardSubmit(){
  if (!cardDraft){ toast('先选一张图'); return; }
  var el = $('#cardName');
  var name = el ? String(el.value || '').trim() : '';
  if (!name){ toast('给它起个名字'); return; }
  if (name.length > 12){ toast('名字最多 12 个字'); return; }
  var desc = String(($('#cardDesc') || {}).value || '').trim();
  if (desc.length > 60){ toast('描述最多 60 字'); return; }
  var cat = String(($('#cardCat') || {}).value || 'face');
  var r = String(($('#cardR') || {}).value || CARD_RARITY_DEFAULT);
  if (CARD_RARITY_OPTIONS.indexOf(r) < 0) r = CARD_RARITY_DEFAULT;
  var btn = $('#cardSend');
  if (btn){ btn.disabled = true; btn.textContent = '上传中…'; }
  rpc('jzca_card_submit', {
    p_code: SHARE.code, p_uid: UID, p_author: displayName(),
    p_name: name, p_mime: 'image/jpeg', p_data: cardDraft.data,
    p_desc: desc, p_cat: cat, p_r: r
  })
    .then(function(){
      cardDraft = null;
      closeSheet();
      return pullCards();
    })
    .then(function(){ render(); toast('提交好了，等大家的票'); })
    .catch(function(e){
      if (btn){ btn.disabled = false; btn.textContent = '提交，等大家投票'; }
      remote.err = String(e.message || e);
      toast('没传上去：' + (e.message || e));
    });
}

function cardVote(id, yes){
  var btn = $('[data-act="cardVote"][data-id="' + id + '"][data-yes="' + (yes ? 1 : 0) + '"]');
  if (btn){ btn.disabled = true; }
  rpc('jzca_card_vote', { p_code: SHARE.code, p_uid: UID, p_card_id: Number(id), p_yes: !!yes })
    .then(function(res){
      if (res && res.status === 'approved') toast('通过！这张进卡池了');
      else if (res && res.status === 'rejected') toast('没通过，这张就不留了');
      else toast('已记一票');
      return pullCards();
    })
    .then(function(){ render(); })
    .catch(function(e){
      remote.err = String(e.message || e);
      toast(e.message || '投票没成功');
      render();
    });
}

/* ---------------------------------------------------------------
   12. 事件总线
   --------------------------------------------------------------- */
$('#app').addEventListener('click', function(e){
  var t = e.target.closest('[data-act]');
  if (!t) return;
  var act = t.dataset.act;

  if (act === 'go'){
    if (t.dataset.dept){ deptView = t.dataset.dept; setTab('dept'); return; }
    if (t.dataset.sub)  studioSub = t.dataset.sub;
    if (t.dataset.feed) wantFeed = true;
    setTab(t.dataset.tab);
    return;
  }
  if (act === 'checkin')     { doCheckin(); return; }
  if (act === 'vote')        { doVote(parseInt(t.dataset.i, 10)); return; }
  if (act === 'like')        { doLike(t.dataset.k, t.dataset.pid, t.dataset.dept); return; }
  if (act === 'comment')     { openComments(t.dataset.pid, t.dataset.dept); return; }
  if (act === 'postNew')     { openCompose(t.dataset.dept); return; }
  // 先清标记再重画，让"点了有反应"这句话成立；
  // 若当前页本来就不需要联网（部门列表/撸猫/剪辑室），这里也不会卡住不动
  if (act === 'retrySync')   { remote.err = null; render(); pullFor(); return; }
  // 走 setTab 而不是直接 render()，是为了让"进部门就拉一次帖子"这条逻辑
  // 和别的标签页共用同一个入口，将来加页面不会漏
  if (act === 'deptOpen')    { deptView = t.dataset.id; setTab('dept'); return; }
  if (act === 'deptBack')    { deptView = null; render(); window.scrollTo(0,0); return; }
  if (act === 'changeDept')  { setDept(t.dataset.id); return; }
  if (act === 'setDept')     { setDept(t.dataset.id); closeSheet(); return; }
  if (act === 'sub')         { studioSub = t.dataset.sub; render(); return; }
  if (act === 'memePick')    { meme.photo = t.dataset.id; syncMeme(); return; }
  if (act === 'memeText')    { meme.text = t.dataset.t; syncMeme(); return; }
  if (act === 'memePos')     { meme.pos = t.dataset.p; render(); return; }
  if (act === 'memeApply'){
    var v = ($('#memeInput').value || '').trim();
    if (!v){ toast('先写点什么'); return; }
    meme.text = v; syncMeme(); render(); return;
  }
  if (act === 'memeMake')    { makeMeme(); return; }
  if (act === 'draw')        { drawCard(); return; }
  if (act === 'drawBatch')   { drawBatch(); return; }
  if (act === 'cardNew')     { openCardSubmit(); return; }
  if (act === 'cardVote')    { cardVote(t.dataset.id, t.dataset.yes === '1'); return; }
  if (act === 'cardOpen')    { openCardDetail(t.dataset.id); return; }
  if (act === 'albumFilter') { applyAlbumFilter(t.dataset.k, t.dataset.v); return; }
  if (act === 'adminOpen')   { openAdmin(); return; }
  if (act === 'adminDel')    { adminDel(t.dataset.kind, t.dataset.id); return; }
  if (act === 'idTap')       { idTap(); return; }
  if (act === 'rename')      { rename(); return; }
  if (act === 'reassign')    { reassign(); return; }
  if (act === 'toggleMotion'){ S.settings.reduceMotion = !S.settings.reduceMotion; save(); render(); return; }
});
function setDept(id){
  var d = DEPT_BY_ID[id];
  if (!d || !d.open) return;
  P.dept = id; save(); render(); vibe(10);
  toast('已调入 ' + d.n);
}
sheetEl.addEventListener('click', function(e){
  if (e.target.closest('[data-close]')) closeSheet();
});

/* ---------------------------------------------------------------
   13. 启动
   --------------------------------------------------------------- */
// 跨天清理：戳猫/投喂/撸猫的每日次数上限按天重置
if (P.pokesDate !== today()){ P.pokesDate = today(); P.pokesToday = 0; }
if (P.feedDate !== today()){ P.feedDate = today(); P.feedToday = 0; }
if (P.purrDate !== today()){ P.purrDate = today(); P.purrToday = 0; }
// fresh 是"新抽到、还没看过"的标记，正常由"打开图鉴"清空，这里只是兜底上限
if (S.album.fresh.length > 3) S.album.fresh = S.album.fresh.slice(-3);
// 职级完全由好感度推导，启动时对齐一次；否则导入的存档会出现
// "好感度 0 分、职级却是副校长"这种自相矛盾的工牌
recalcLevel();
save();

/* 回到前台就刷新一次。
   手机上最常见的动作是"锁屏 / 切走 → 再打开"，而这是个长驻的页面：
   不刷新的话，用户看到的是进页面那一刻的快照，会以为"同事都没发新东西"。
   切走时反过来 —— 把还没发出去的那次同步立刻发掉。 */
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible') pullFor();
  else flushPush();
});

runOnboard();

})();
