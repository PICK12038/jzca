<title>姜校长办公室</title>
<style>
:root{
  --paper:#F7F5F0; --card:#FFFFFF; --line:#E6E2D9; --line2:#F0EDE6;
  --ink:#22201D; --ink2:#6B675F; --ink3:#9C978C;
  --moss:#5A6152; --moss-l:#EAEDE5; --moss-d:#3E4438;
  --amber:#C98A2E; --amber-l:#FBF1DE;
  --seal:#B5452F; --seal-l:#FBEBE7;
  --silver:#A8A29E; --silver-l:#F1EFEC;
  --dark:#141414;
  --safe:env(safe-area-inset-bottom,0px);
  --tabh:60px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#E8E5DE;color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  font-size:15px;line-height:1.7;letter-spacing:.01em;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
img{display:block;max-width:100%;-webkit-user-drag:none;user-select:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.hidden{display:none !important}

/* ================= 外壳 ================= */
#app{
  max-width:430px;margin:0 auto;min-height:100vh;background:var(--paper);
  position:relative;overflow-x:hidden;box-shadow:0 0 44px rgba(34,32,29,.10);
}

/* ================= 启动页 ================= */
.onboard{
  position:fixed;top:0;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;
  background:var(--dark);z-index:100;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;
  transition:opacity .55s ease,transform .55s ease;
}
.onboard.out{opacity:0;transform:translateY(-12px);pointer-events:none}
.ob-bg{position:absolute;inset:0}
.ob-bg img{width:100%;height:100%;object-fit:cover;opacity:.52;animation:obZoom 5s ease-out both}
@keyframes obZoom{from{transform:scale(1.07)}to{transform:scale(1)}}
.ob-veil{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(14,14,14,.88) 0%,rgba(14,14,14,.16) 34%,rgba(14,14,14,.55) 62%,rgba(14,14,14,.97) 100%);
}
.ob-paw{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.4);
  width:112px;height:112px;border-radius:50%;background:rgba(181,69,47,.9);
  display:flex;align-items:center;justify-content:center;font-size:46px;
  opacity:0;box-shadow:0 0 0 12px rgba(181,69,47,.14);
}
.ob-paw.stamp{animation:stamp .62s cubic-bezier(.2,1.5,.5,1) forwards}
@keyframes stamp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(2.6) rotate(-24deg)}
  55%{opacity:1;transform:translate(-50%,-50%) scale(.86) rotate(-9deg)}
  75%{transform:translate(-50%,-50%) scale(1.06) rotate(-13deg)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-12deg)}
}
.ob-body{position:relative;z-index:3;padding:0 30px 42px;color:#F4F1EA}
.ob-brand{font-size:10.5px;letter-spacing:4px;color:var(--amber);font-weight:800;margin-bottom:16px}
.ob-title{font-size:36px;font-weight:800;letter-spacing:3px;line-height:1.22}
.ob-status{font-size:12.5px;color:#B5B0A6;margin-top:15px;letter-spacing:.5px;min-height:19px}
.ob-bar{height:3px;background:rgba(255,255,255,.15);border-radius:2px;margin-top:12px;overflow:hidden}
.ob-bar i{display:block;height:100%;width:0;background:var(--amber);border-radius:2px;transition:width .3s ease}
.ob-card{
  display:flex;align-items:center;gap:9px;margin-top:22px;opacity:0;transform:translateY(8px);
  transition:.42s ease;
}
.ob-card.on{opacity:1;transform:none}
.ob-card .paw{
  width:34px;height:34px;border-radius:50%;background:var(--seal);color:#fff;flex:0 0 34px;
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.ob-card .tx{font-size:11.5px;color:#8F8A80;letter-spacing:.4px}
.ob-enter{
  margin-top:26px;width:100%;background:var(--moss);color:#fff;font-size:15px;font-weight:800;
  letter-spacing:3px;padding:15px 0;border-radius:13px;opacity:0;transform:translateY(8px);
  transition:.42s ease;
}
.ob-enter.on{opacity:1;transform:none}
.ob-enter:active{transform:scale(.975)}

/* ================= 顶栏 ================= */
.topbar{
  position:sticky;top:0;z-index:30;height:54px;display:flex;align-items:center;
  padding:0 16px;gap:10px;
  background:rgba(247,245,240,.93);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar .tb-l{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.topbar .tb-t{flex:1;text-align:center;font-size:16px;font-weight:800;letter-spacing:1.2px}
.topbar .tb-r{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.tb-back{
  width:32px;height:32px;border-radius:10px;background:var(--silver-l);
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.coin-chip{
  display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;
  background:var(--amber-l);color:#8A5D16;padding:4px 10px;border-radius:20px;
}
.coin-chip.bump{animation:coinBump .45s ease}
@keyframes coinBump{0%{transform:scale(1)}45%{transform:scale(1.2)}100%{transform:scale(1)}}

/* ================= 页面容器 ================= */
.pages{padding-bottom:calc(var(--tabh) + var(--safe) + 8px)}

/* ================= Tab 栏 ================= */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;z-index:40;
  height:calc(var(--tabh) + var(--safe));padding-bottom:var(--safe);
  display:flex;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;font-size:9.5px;font-weight:700;color:var(--ink3);letter-spacing:.5px;
  transition:color .16s;
}
.tabbar button i{font-size:19px;font-style:normal;filter:grayscale(1);opacity:.42;transition:.16s;line-height:1}
.tabbar button.on{color:var(--ink)}
.tabbar button.on i{filter:none;opacity:1;transform:translateY(-1px)}
.tabbar button:active i{transform:scale(.9)}

/* ================= 通用组件 ================= */
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;min-width:0}
.card+.card{margin-top:11px}
.sec-t{
  font-size:11px;font-weight:800;letter-spacing:2px;color:var(--ink3);
  margin:20px 0 10px;display:flex;align-items:center;justify-content:space-between;
}
.sec-t:first-child{margin-top:4px}
.sec-t .more{font-size:11.5px;color:var(--moss);font-weight:700;letter-spacing:0}
.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
  padding:13px 0;border-radius:12px;font-size:14px;font-weight:800;letter-spacing:1px;
  background:var(--moss);color:#fff;transition:transform .12s,opacity .16s;
}
.btn:active{transform:scale(.977)}
.btn.ghost{background:var(--silver-l);color:var(--ink2)}
.btn.amber{background:var(--amber);color:#1F1B12}
.btn:disabled{opacity:.42;pointer-events:none}
.btn.sm{padding:9px 16px;font-size:12.5px;width:auto;letter-spacing:.5px}
.pill{
  display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.5px;
  padding:3px 9px;border-radius:20px;background:var(--silver-l);color:var(--ink2);
}
.pill.moss{background:var(--moss-l);color:var(--moss-d)}
.pill.amber{background:var(--amber-l);color:#8A5D16}
.pill.seal{background:var(--seal-l);color:#8E3623}
.pill.demo{background:#EFEDE7;color:#9C978C;border:1px dashed #D6D1C6}
/* 共享层连不上时的提示条。用最低调的方式说最重要的事：不挡住操作，但看得见。
   它本身是个按钮 —— 点一下就地重试，不用让用户去刷新整页 */
button.sync-note{
  display:block;width:100%;text-align:left;margin:11px 0 0;padding:11px 13px;
  border-radius:10px;font-size:12px;line-height:1.6;font-family:inherit;
  background:#FBF3E6;border:1px solid #EAD9BC;color:#8A6A2A;font-weight:700;
}
button.sync-note:active{transform:scale(.985)}
/* 失败原因用更小更淡的字挂在下面：它是给能读懂的人看的，不该抢主句的注意力 */
button.sync-note .why{display:block;margin-top:3px;font-size:10.5px;font-weight:600;opacity:.78;word-break:break-all}
/* 微信里的提示：不是错误、也不能点重试（重试也不会通），所以是一段说明，不是按钮 */
div.sync-note.wx{display:block;width:100%;text-align:left;margin:11px 0 0;padding:11px 13px;
  border-radius:10px;font-size:12px;line-height:1.6;font-family:inherit;
  background:#EEF1E9;border:1px solid #D8DED0;color:#4E5647;font-weight:700;cursor:default}
/* 部门页的发帖入口。固定在内容之上而不是塞进某张卡里，避免和「申请调岗」抢视线 */
.post-new{margin-bottom:13px}
.post-empty{padding:22px 16px;text-align:center}
.hr{height:1px;background:var(--line2);margin:13px 0}
.muted{color:var(--ink2);font-size:13px}
.tiny{color:var(--ink3);font-size:11.5px;line-height:1.65}

/* ================= 首页 · 实时状态 ================= */
.status-card{border-radius:17px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.status-photo{position:relative;height:230px;background:#EDEAE3;overflow:hidden}
.status-photo img{width:100%;height:100%;object-fit:cover}
.status-photo .live{
  position:absolute;left:11px;top:11px;font-size:10px;font-weight:800;color:#fff;
  background:rgba(14,14,14,.7);padding:4px 10px;border-radius:20px;
  backdrop-filter:blur(6px);display:flex;align-items:center;gap:5px;letter-spacing:.5px;
}
.status-photo .live::before{
  content:"";width:6px;height:6px;border-radius:50%;background:#7BD86A;
  box-shadow:0 0 0 3px rgba(123,216,106,.24);animation:blink 1.8s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.status-photo .rr{
  position:absolute;right:11px;top:11px;font-size:9.5px;font-weight:800;
  background:rgba(201,138,46,.92);color:#231A0A;padding:4px 9px;border-radius:6px;
}
.status-body{padding:14px 16px 16px}
.status-body .st-title{font-size:16.5px;font-weight:800;letter-spacing:.5px;line-height:1.45}
.status-body .st-loc{font-size:11px;color:var(--ink3);margin-top:5px}
.status-body .st-tags{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}

/* ================= 议题 ================= */
.topic{background:var(--amber-l);border:1px solid #EBD9B4;border-radius:15px;padding:15px 16px}
.topic .tp-k{font-size:10px;font-weight:800;color:#8A5D16;letter-spacing:1.6px}
.topic .tp-q{font-size:15px;font-weight:800;margin-top:6px;line-height:1.5}
.topic .tp-opts{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.opt{
  position:relative;background:#fff;border:1px solid #EBD9B4;border-radius:10px;
  padding:10px 13px;font-size:13.5px;font-weight:600;overflow:hidden;text-align:left;
  transition:transform .12s;
}
.opt:active{transform:scale(.985)}
.opt .fill{
  position:absolute;left:0;top:0;bottom:0;width:0;background:var(--amber-l);
  transition:width .55s cubic-bezier(.3,1,.4,1);z-index:0;
}
.opt .lbl{position:relative;z-index:1;display:flex;justify-content:space-between;gap:10px}
.opt .pct{font-weight:800;color:#8A5D16;font-variant-numeric:tabular-nums}
.opt.picked{border-color:var(--amber);border-width:1.5px}
.opt.picked .lbl::after{content:" ✓";color:var(--amber);font-weight:800}

/* ================= 快捷四宫格 ================= */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.quick button{
  background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:13px 0 10px;display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:transform .12s;
}
.quick button:active{transform:scale(.955)}
.quick button i{font-size:20px;font-style:normal;line-height:1}
.quick button span{font-size:10px;font-weight:700;color:var(--ink2);letter-spacing:.3px}

/* ================= 帖子 ================= */
.post{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.post+.post{margin-top:10px}
.post-h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.post-av{
  width:28px;height:28px;border-radius:50%;background:var(--moss-l);flex:0 0 28px;
  display:flex;align-items:center;justify-content:center;font-size:13px;
}
.post-h .who{font-size:12.5px;font-weight:700}
.post-h .when{font-size:10.5px;color:var(--ink3)}
.post-t{font-size:14.5px;font-weight:800;margin-bottom:5px;line-height:1.5}
.post-c{font-size:13.5px;color:var(--ink2);line-height:1.72;white-space:pre-wrap}
.post-f{display:flex;align-items:center;gap:14px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line2)}
.post-f button{
  display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink3);font-weight:700;
}
.post-f button.on{color:var(--seal)}
.post-f button:active{transform:scale(.94)}
/* 评论条目。左侧竖线是"这是别人的话"的视觉锚点，比缩进更省横向空间 */
.cmt{padding:11px 0;border-bottom:1px solid var(--line2)}
.cmt:last-child{border-bottom:none}
.cmt-h{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.cmt-h b{font-size:12.5px;font-weight:800}
.cmt-h span{font-size:10.5px;color:var(--ink3)}
.cmt-b{font-size:13.5px;color:var(--ink2);line-height:1.7;white-space:pre-wrap;padding-left:10px;border-left:2px solid var(--moss-l)}
#cmtList{max-height:44vh;overflow-y:auto}
/* 排行榜。名次用等宽数字，避免出现 10 的时候整列宽度跳动 */
.rank{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line2)}
.rank:last-child{border-bottom:none}
.rank .no{width:22px;flex:0 0 22px;font-size:12px;font-weight:800;color:var(--ink3);text-align:center;font-variant-numeric:tabular-nums}
.rank .no.top{color:var(--moss)}
.rank .nm{flex:1;min-width:0;font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .nm.me{color:var(--moss)}
.rank .sub{font-size:10.5px;color:var(--ink3);font-weight:600}
.rank .sc{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ================= 部门 ================= */
.depts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dept{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;overflow:hidden;text-align:left;transition:transform .12s;
}
.dept:active{transform:scale(.975)}
.dept .bar{position:absolute;left:0;top:0;bottom:0;width:3.5px}
.dept .ic{font-size:20px;line-height:1}
.dept .nm{font-size:13.5px;font-weight:800;margin-top:7px;letter-spacing:.3px}
.dept .rl{font-size:10px;color:var(--ink3);margin-top:2px;font-weight:600}
.dept .ft{font-size:10.5px;font-weight:700;margin-top:9px}
.dept .ok{
  position:absolute;right:9px;top:9px;width:16px;height:16px;border-radius:50%;
  background:var(--moss);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;
}
.dept.locked{opacity:.62}
.dept.locked .ft{color:var(--ink3) !important}

/* ================= 撸猫页 ================= */
.cat-wrap{
  position:relative;margin:-14px -14px 0;background:var(--dark);
  height:calc(100vh - var(--tabh) - var(--safe) - 54px);overflow:hidden;
}
.cat-stage{position:absolute;inset:0;touch-action:none}
.cat-stage img{width:100%;height:100%;object-fit:cover;transition:opacity .28s ease,transform .28s ease}
.cat-stage img.swap{opacity:.25;transform:scale(1.02)}
.cat-veil{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(14,14,14,.72) 0%,rgba(14,14,14,0) 26%,rgba(14,14,14,0) 52%,rgba(14,14,14,.92) 100%);
}
.cat-hud{position:absolute;top:0;left:0;right:0;padding:14px 18px;color:#fff;pointer-events:none;z-index:5}
.cat-hud .lv{display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:2px;color:var(--amber)}
.aff-bar{width:148px;height:4px;background:rgba(255,255,255,.2);border-radius:3px;margin:8px auto 0;overflow:hidden}
.aff-bar i{display:block;height:100%;width:0;background:var(--amber);border-radius:3px;transition:width .5s cubic-bezier(.3,1,.4,1)}
.hold-ring{
  position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:96px;height:96px;
  pointer-events:none;opacity:0;transition:opacity .18s;z-index:6;
}
.hold-ring.on{opacity:1}
.hold-ring svg{transform:rotate(-90deg)}
.hold-ring .bgc{stroke:rgba(255,255,255,.2)}
.hold-ring .fgc{stroke:var(--amber);transition:stroke-dashoffset .08s linear}
.cat-hint{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;
  color:rgba(255,255,255,.86);pointer-events:none;z-index:4;transition:opacity .3s;
}
.cat-hint .ring{
  width:60px;height:60px;border-radius:50%;border:2px dashed rgba(255,255,255,.55);
  display:flex;align-items:center;justify-content:center;font-size:21px;margin:0 auto;
  animation:pulseR 2.1s ease-in-out infinite;
}
@keyframes pulseR{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.1);opacity:1}}
.cat-hint .tx{font-size:11px;margin-top:10px;font-weight:600;letter-spacing:.5px}
.cat-hint.gone{opacity:0}
.cat-say{
  position:absolute;left:0;right:0;bottom:132px;text-align:center;z-index:7;pointer-events:none;
  padding:0 30px;
}
.cat-say span{
  display:inline-block;background:rgba(14,14,14,.78);color:#F4F1EA;font-size:12.5px;
  padding:8px 15px;border-radius:20px;backdrop-filter:blur(8px);line-height:1.5;
  animation:sayIn .3s ease both;
}
@keyframes sayIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.emoji-fx{
  position:absolute;font-size:26px;pointer-events:none;z-index:8;
  animation:fxUp 1s ease-out forwards;
}
@keyframes fxUp{
  0%{opacity:0;transform:translateY(0) scale(.6)}
  22%{opacity:1;transform:translateY(-16px) scale(1.15)}
  100%{opacity:0;transform:translateY(-72px) scale(.9)}
}
.cat-dock{
  position:absolute;left:0;right:0;bottom:0;padding:0 16px 18px;z-index:9;
}
.cat-dock .sayline{font-size:11.5px;color:#B5B0A6;margin-bottom:10px;text-align:center;min-height:17px}
.feed-row{display:flex;gap:9px}
.feed-btn{
  flex:1;position:relative;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  border-radius:13px;padding:11px 0;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:#F4F1EA;backdrop-filter:blur(8px);transition:transform .12s;touch-action:none;
}
.feed-btn:active{transform:scale(.96)}
.feed-btn .fi{font-size:19px;line-height:1}
.feed-btn .fn{font-size:11.5px;font-weight:800}
.feed-btn .fc{font-size:9.5px;color:#B5B0A6}
.feed-btn.dragging{opacity:.35}
.ghost-feed{
  position:fixed;width:56px;height:56px;border-radius:50%;background:rgba(201,138,46,.94);
  display:flex;align-items:center;justify-content:center;font-size:26px;z-index:200;
  pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 6px 20px rgba(0,0,0,.4);
}
/* 投喂额度说明：一行小字，不抢操作区 */
.feed-note{font-size:10.5px;color:#C9C4B8;text-align:center;margin-top:8px;letter-spacing:.4px}
/* 连击投喂的飘字：从猫身上弹起、放大、渐隐 */
.combo-fx{
  position:absolute;z-index:60;font-size:17px;font-weight:900;color:var(--amber);
  text-shadow:0 2px 10px rgba(0,0,0,.55);pointer-events:none;white-space:nowrap;
  transform:translate(-50%,-50%);animation:comboUp 1.05s ease-out both;
}
@keyframes comboUp{
  0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}
  18%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-190%) scale(1)}
}
.drop-zone{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:170px;height:170px;
  border:2px dashed rgba(201,138,46,0);border-radius:50%;z-index:4;pointer-events:none;transition:.2s;
}
.drop-zone.near{border-color:rgba(201,138,46,.75);background:rgba(201,138,46,.1)}

/* ================= 剪辑室 ================= */
.seg{display:flex;background:var(--silver-l);border-radius:12px;padding:3px;margin-bottom:15px}
.seg button{
  flex:1;padding:9px 0;border-radius:10px;font-size:13px;font-weight:700;color:var(--ink2);
  transition:.16s;
}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(34,32,29,.09)}

.meme-stage{
  border-radius:15px;overflow:hidden;background:#111;position:relative;
  aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;
}
.meme-stage canvas{width:100%;height:100%;object-fit:contain;display:block}
.meme-txt{
  position:absolute;left:0;right:0;text-align:center;padding:0 14px;
  font-size:21px;font-weight:900;color:#fff;letter-spacing:1px;line-height:1.3;
  text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 3px 6px rgba(0,0,0,.5);
  word-break:break-word;
}
.meme-txt.top{top:14px}
.meme-txt.bottom{bottom:14px}
.picker{display:flex;gap:7px;overflow-x:auto;padding:3px 0 8px;scrollbar-width:none}
.picker::-webkit-scrollbar{display:none}
.picker button{
  flex:0 0 auto;width:56px;height:74px;border-radius:9px;overflow:hidden;
  border:2px solid transparent;background:#EDEAE3;padding:0;transition:.14s;
}
.picker button img{width:100%;height:100%;object-fit:cover}
.picker button.on{border-color:var(--moss);transform:translateY(-2px)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:20px;
  background:var(--card);border:1px solid var(--line);transition:.14s;
}
.chip.on{background:var(--moss);color:#fff;border-color:var(--moss)}
.chip:active{transform:scale(.95)}
input.txt,textarea.txt{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;
  font-size:14px;font-family:inherit;background:var(--card);color:var(--ink);outline:none;
}
input.txt{height:auto}
/* textarea 必须显式设 line-height 与 resize 方向，否则 iOS 上 Safari 会
   按默认 1.2 行高挤成一团，且右下角出现一个和圆角打架的斜纹手柄 */
textarea.txt{resize:vertical;line-height:1.65;min-height:92px}
input.txt:focus,textarea.txt:focus{border-color:var(--moss)}

/* 图鉴 */
.alb-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.alb-btns{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
.alb-btns .btn{width:auto;padding-left:14px;padding-right:14px;white-space:nowrap}
/* 社区投稿的标记：压右上角。
   左上角已经被稀有度标签占了 —— 两个都放左边就是叠在一起，别问我怎么知道的 */
.alb .up{
  position:absolute;right:6px;top:6px;z-index:2;font-size:9px;font-weight:800;
  padding:2px 6px;border-radius:20px;background:var(--moss);color:#fff;letter-spacing:.5px;
}
/* 投稿与审核 */
.draft{display:block;width:100%;max-height:210px;object-fit:contain;border-radius:12px;
  background:#EFEDE7;margin-bottom:13px}
.draft.sm{max-height:120px}
/* 图鉴筛选条 */
.filters{margin:2px 0 12px}
.f-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.f-lab{font-size:11.5px;font-weight:800;color:var(--ink3);flex:0 0 40px}
.f-chip{font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px;border:1px solid var(--line);
  background:#fff;color:var(--ink2);font-family:inherit}
.f-chip.on{background:var(--moss);border-color:var(--moss);color:#fff}
/* 卡片详情 */
.meta-row{display:flex;gap:8px;align-items:center}
.rk-badge{font-size:11px;font-weight:900;padding:3px 9px;border-radius:6px;background:rgba(14,14,14,.72);color:#D8D3C8;letter-spacing:.5px}
.rk-badge.ssr{background:#B5452F;color:#fff}
.rk-badge.sr{background:#C98A2E;color:#fff}
.rk-badge.r{background:#5A6152;color:#fff}
.rk-badge.n{background:#A8A29E;color:#fff}
.cat-badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px;background:var(--moss-l);color:var(--moss)}
.up.big{font-size:11px;font-weight:800;color:var(--moss);margin-left:8px;background:var(--moss-l);
  border-radius:20px;padding:2px 9px;vertical-align:4px}
/* 表单标签 */
.lbl{display:block;font-size:11.5px;font-weight:800;color:var(--ink3);margin:12px 0 5px}
/* 管理面板 */
.admin-sec{font-size:12px;font-weight:800;color:var(--ink3);margin:16px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
.admin-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2)}
.admin-row .a-t{flex:1;min-width:0;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-row .a-who{font-size:11px;color:var(--ink3);flex:0 0 auto}
.admin-row .btn{flex:0 0 auto;padding-left:12px;padding-right:12px}
.pend{display:flex;gap:12px;align-items:flex-start}
.pend img{width:84px;height:84px;flex:0 0 84px;border-radius:11px;object-fit:cover;background:#EFEDE7}
.pend-b{flex:1;min-width:0}
.pend .pn{font-size:14px;font-weight:800;margin-bottom:3px}
.pend .mine{font-size:10px;font-weight:800;color:var(--moss);margin-left:6px;
  background:var(--moss-l);border-radius:20px;padding:1px 7px}
.bar-wrap{height:5px;border-radius:4px;background:var(--silver-l);overflow:hidden;margin:8px 0 5px}
.bar-wrap i{display:block;height:100%;background:var(--moss);transition:width .3s}
.vote-row{display:flex;gap:8px;margin-top:9px}
.vote-row .btn{width:auto;flex:1;padding-left:0;padding-right:0}
.btn.sm.ok{background:var(--moss);color:#fff}
.btn.sm.ok:disabled{opacity:.5}
/* 锁定提示：标题单独一行、说明在下面。
   原来是标题和说明并排，在 390px 宽度下会挤成"标题 + 半句换行"，看着像没排过版 */
.lk-line .lk-t{font-size:14px;font-weight:800;margin-bottom:5px}
/* 十连结果 */
.batch-sum{font-size:13.5px;color:var(--ink2);margin-bottom:11px}
.batch-sum b{color:var(--ink);font-size:15px}
.batch-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.bg-item{position:relative;border-radius:10px;overflow:hidden;background:#EFEDE7;aspect-ratio:1/1}
.bg-item img{width:100%;height:100%;object-fit:cover;display:block}
.bg-item.dup img{opacity:.4}
.bg-r{position:absolute;left:4px;top:4px;font-size:9px;font-weight:800;color:#fff;
  background:rgba(20,19,17,.55);border-radius:20px;padding:1px 6px}
.bg-dup{position:absolute;inset:auto 0 0 0;text-align:center;font-size:9px;font-weight:800;
  color:#fff;background:rgba(20,19,17,.6);padding:2px 0}
.draw-card.dup img{filter:grayscale(.7);opacity:.75}
.alb-prog{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.1;font-variant-numeric:tabular-nums}
.alb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.alb{
  position:relative;border-radius:12px;overflow:hidden;aspect-ratio:3/4;background:#EDEAE3;
  border:1px solid var(--line);
}
.alb img{width:100%;height:100%;object-fit:cover}
.alb.lock img{filter:grayscale(1) brightness(.34);opacity:.55}
.alb .rk{
  position:absolute;top:6px;left:6px;font-size:9px;font-weight:900;padding:2px 7px;border-radius:5px;
  background:rgba(14,14,14,.72);color:#D8D3C8;backdrop-filter:blur(4px);letter-spacing:.4px;
}
.alb .rk.ssr{background:linear-gradient(135deg,#B5452F,#E0803A);color:#fff}
.alb .rk.sr{background:rgba(201,138,46,.92);color:#231A0A}
.alb .nm{
  position:absolute;left:0;right:0;bottom:0;padding:16px 7px 6px;color:#fff;font-size:9.5px;
  font-weight:700;background:linear-gradient(transparent,rgba(14,14,14,.85));line-height:1.35;
}
.alb.lock .nm{color:#B5B0A6}
.alb .lockmark{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;opacity:.7;
}
.alb.new::after{
  content:"NEW";position:absolute;right:6px;top:6px;font-size:8px;font-weight:900;
  background:var(--seal);color:#fff;padding:2px 5px;border-radius:4px;
}

/* 抽卡结果 */
.draw-card{
  width:210px;margin:0 auto;border-radius:16px;overflow:hidden;background:var(--card);
  box-shadow:0 20px 46px -14px rgba(0,0,0,.5);animation:drawIn .55s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes drawIn{from{opacity:0;transform:scale(.72) rotateY(38deg)}to{opacity:1;transform:none}}
.draw-card img{width:100%;aspect-ratio:3/4;object-fit:cover}
.draw-card .dc-b{padding:14px 16px 16px;text-align:center}
.draw-card .dc-b .r{font-size:11px;font-weight:900;letter-spacing:2px;color:var(--amber)}
.draw-card .dc-b .n{font-size:16px;font-weight:800;margin-top:5px}
.draw-card .dc-b .d{font-size:12px;color:var(--ink2);margin-top:6px;line-height:1.6}

/* ================= 我的 · 工牌 ================= */
.idcard{
  border-radius:17px;overflow:hidden;background:var(--paper);
  box-shadow:0 14px 34px -12px rgba(34,32,29,.34);border:1px solid var(--line);
}
.idcard .ic-top{
  background:var(--moss);padding:11px 16px;display:flex;align-items:center;justify-content:space-between;
}
.idcard .ic-top .l{color:#fff;font-size:11px;font-weight:800;letter-spacing:2.4px}
.idcard .ic-top .r{color:#C9CFC0;font-size:9px;letter-spacing:1.4px}
.idcard .ic-mid{padding:16px;display:flex;gap:14px}
.idcard .ic-mid img{width:78px;height:98px;object-fit:cover;border-radius:9px;flex:0 0 78px;background:#EDEAE3}
.idcard .ic-name{font-size:18px;font-weight:800;letter-spacing:1.5px}
.idcard .ic-id{font-size:10.5px;color:var(--ink3);margin-top:3px;font-variant-numeric:tabular-nums}
.idcard .ic-dept{
  display:inline-block;font-size:10.5px;background:var(--moss-l);color:var(--moss-d);
  font-weight:800;padding:3px 10px;border-radius:20px;margin-top:9px;
}
.idcard .ic-meta{font-size:10.5px;color:var(--ink2);margin-top:9px;line-height:1.62}
.idcard .ic-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 14px;text-align:center}
.idcard .ic-stats div{background:#F1EFE9;border-radius:10px;padding:9px 0}
.idcard .ic-stats .v{font-size:15.5px;font-weight:800;font-variant-numeric:tabular-nums}
.idcard .ic-stats .k{font-size:9px;color:var(--ink3);margin-top:1px}
.barcode{
  height:30px;margin:0 16px;border-radius:3px;
  background:repeating-linear-gradient(90deg,#22201D 0 1.6px,transparent 1.6px 3.2px,#22201D 3.2px 4px,transparent 4px 7px);
}
.idcard .ic-code{
  text-align:center;font-size:9px;color:var(--ink3);letter-spacing:2.4px;margin-top:5px;
  font-family:ui-monospace,Menlo,Consolas,monospace;
}
.idcard .ic-foot{
  padding:0 16px 16px;display:flex;align-items:center;justify-content:space-between;margin-top:12px;
}
.idcard .ic-note{font-size:9.5px;color:var(--ink3);line-height:1.55}
.stamp{
  width:54px;height:54px;border:2px solid var(--seal);border-radius:50%;color:var(--seal);
  display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;
  text-align:center;line-height:1.22;transform:rotate(-12deg);flex:0 0 54px;
}

/* 列表行 */
.row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 0;border-bottom:1px solid var(--line2);text-align:left;width:100%;
}
.row:last-child{border-bottom:none}
.row .rl{font-size:13.5px;font-weight:600}
.row .rd{font-size:11.5px;color:var(--ink3);margin-top:2px}
.row .rv{font-size:13.5px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.row:active{opacity:.7}

/* 开关 */
.sw{width:44px;height:26px;border-radius:20px;background:var(--silver);position:relative;transition:.2s;flex:0 0 44px}
.sw::after{
  content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.24);
}
.sw.on{background:var(--moss)}
.sw.on::after{transform:translateX(18px)}

/* ================= 弹层 ================= */
.sheet{
  position:fixed;inset:0;z-index:150;display:none;
}
.sheet.on{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(20,19,17,.55);backdrop-filter:blur(3px);animation:fadeIn .2s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet-body{
  position:absolute;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;
  background:var(--paper);border-radius:22px 22px 0 0;padding:22px 18px calc(24px + var(--safe));
  max-height:88vh;overflow-y:auto;animation:sheetUp .3s cubic-bezier(.2,1,.4,1) both;
}
@keyframes sheetUp{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet-title{font-size:17px;font-weight:800;letter-spacing:.5px;margin-bottom:4px}
.sheet-sub{font-size:12px;color:var(--ink3);margin-bottom:16px;line-height:1.65}

/* ================= Toast ================= */
.toast{
  position:fixed;left:50%;bottom:calc(var(--tabh) + var(--safe) + 22px);transform:translate(-50%,12px);
  background:var(--ink);color:#F4F1EA;font-size:13px;font-weight:700;letter-spacing:.3px;
  padding:11px 22px;border-radius:24px;opacity:0;pointer-events:none;transition:.24s;
  z-index:300;max-width:88vw;text-align:center;line-height:1.5;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* 撸猫页底部被投喂按钮区(.cat-dock ≈124px)占满，把 toast 抬到其上方，避免遮挡控件 */
body[data-tab="cat"] .toast{bottom:calc(var(--tabh) + var(--safe) + 146px)}

/* ================= 首次引导 ================= */
.guide{
  position:fixed;inset:0;z-index:180;background:rgba(20,19,17,.72);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:26px;
}
.guide.on{display:flex;animation:fadeIn .25s ease both}
.guide-box{
  background:var(--paper);border-radius:20px;padding:24px 22px;max-width:340px;width:100%;
  animation:sheetUp .34s cubic-bezier(.2,1,.4,1) both;
}
.guide-box h3{font-size:19px;font-weight:800;letter-spacing:1px;margin-bottom:6px}
.guide-box .gs{font-size:12.5px;color:var(--ink3);margin-bottom:18px;line-height:1.7}
.guide-item{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line2)}
.guide-item:last-of-type{border-bottom:none}
.guide-item .gi{font-size:19px;flex:0 0 24px;line-height:1.5}
.guide-item .gt{font-size:13.5px;font-weight:700}
.guide-item .gd{font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.6}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* 「减少动效」开关：由 body.reduce-motion 驱动（设置在 render 里同步）。
   与上面的系统偏好是两条独立路径，用户手动开关同样生效。 */
body.reduce-motion *,body.reduce-motion *::before,body.reduce-motion *::after{
  animation-duration:.01ms !important;animation-iteration-count:1 !important;
  transition-duration:.01ms !important;
}
body.reduce-motion #app{scroll-behavior:auto}

/* 从首页"投喂"快捷入口进来时，投喂区脉冲三下，把视线带到该操作的地方 */
.feed-row.attn .feed-btn{animation:feedPulse 1s ease-in-out 3;border-color:rgba(201,138,46,.85)}
@keyframes feedPulse{0%,100%{transform:none}50%{transform:translateY(-6px)}}
</style>
</head>
<body>

<div id="app">

  <!-- ===================== 启动页 ===================== -->
  <div class="onboard" id="onboard">
    <div class="ob-bg"><img src="assets/t16.jpg" alt="土豆"></div>
    <div class="ob-veil"></div>
    <div class="ob-paw" id="obPaw">🐾</div>
    <div class="ob-body">

      <div class="ob-status" id="obStatus">正在为你制作工牌…</div>
      <div class="ob-bar"><i id="obBar"></i></div>
      <div class="ob-card" id="obCard">
        <div class="paw">🐾</div>
        <div class="tx" id="obCardText"></div>
      </div>
      <button class="ob-enter" id="obEnter">进 入 办 公 室</button>
    </div>
  </div>

  <!-- ===================== 主应用 ===================== -->
  <div id="main" class="hidden">

    <header class="topbar">
      <div class="tb-l" id="tbL"></div>
      <div class="tb-t" id="tbT">校长办公室</div>
      <div class="tb-r" id="tbR"></div>
    </header>

    <div class="pages" id="pageHost"></div>

    <nav class="tabbar" id="tabbar">
      <button data-tab="home" class="on"><i>🏛️</i><span>校长</span></button>
      <button data-tab="cat"><i>🐾</i><span>撸猫</span></button>
      <button data-tab="dept"><i>💬</i><span>部门</span></button>
      <button data-tab="studio"><i>🎨</i><span>剪辑室</span></button>
      <button data-tab="me"><i>🎫</i><span>我的</span></button>
    </nav>

  </div>

  <div class="sheet" id="sheet">
    <div class="sheet-bg" data-close></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div class="guide" id="guide">
    <div class="guide-box">
      <h3>欢迎入职</h3>
      <div class="gs">你已获得一张工牌。办公室里有只猫，职位是校长，它不打算管事。</div>
      <div class="guide-item"><div class="gi">🏛️</div><div><div class="gt">校长</div><div class="gd">看它此刻在干嘛，投今天的一票</div></div></div>
      <div class="guide-item"><div class="gi">🐾</div><div><div class="gt">撸猫</div><div class="gd">戳它、按住撸背、拖东西喂它</div></div></div>
      <div class="guide-item"><div class="gi">💬</div><div><div class="gt">部门</div><div class="gd">六个部门，先看看大家在说什么</div></div></div>
      <div class="guide-item"><div class="gi">🎨</div><div><div class="gt">剪辑室</div><div class="gd">做表情包、抽图鉴，攒鱼干全靠它</div></div></div>
      <button class="btn" style="margin-top:20px" id="guideOk">知道了，进去看看</button>

// 注意：不能用 toISOString()，那是 UTC，中国时区晚上会算成第二天
function today(){
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function dayNo(ds){
  var p = ds.split('-');
  return Math.floor(new Date(+p[0], +p[1]-1, +p[2]).getTime() / 86400000);
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function rint(n){ return Math.floor(Math.random()*n); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
// 稳定哈希：同一天/同一题永远得到同样的伪随机结果
function hash(str){
  var h = 2166136261;
  for (var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = (h*16777619) >>> 0; }
  return h >>> 0;
}
function seeded(str, i){ return (hash(str + ':' + i) % 1000) / 1000; }
// 震动：浏览器要求用户先有过交互，否则会抛 warning
var interacted = false;
function markInteract(){ interacted = true; }
document.addEventListener('pointerdown', markInteract, {once:true, passive:true});
document.addEventListener('touchstart', markInteract, {once:true, passive:true});
function vibe(ms){ try { if (interacted && navigator.vibrate) navigator.vibrate(ms); } catch(e){} }

function read(k, fb){
  try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch(e){ return fb; }
}
function write(k, v){
  try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch(e){ return false; }
}

function newProfile(){
  var y = new Date().getFullYear();
  var n = rint(9000) + 1000;
  var d = pick(DEPTS.filter(function(x){ return x.open; }));
  return {
    version: 1,
    staffId: 'JZ-' + y + '-' + pad2(rint(90)+10) + n,
    dept: d.id,
    level: 1,
    coins: 120,
    joinedAt: today(),
    lastCheckIn: '',
    streak: 0,
    nickname: '',
    pokesToday: 0,
    pokesDate: today(),
    feedToday: 0,        // 今天投喂了几次（前 20 次免费）
    feedDate: today(),
    purrToday: 0,        // 今天撸了几次（上限 50）
    purrDate: today(),
    exportClicks: 0
  };
}
function newState(){
  return {
    album: { unlocked: ['t16'], fresh: [] },
    votes: {},
    feedings: [],
    affection: 0,
    liked: [],      // 已点赞的帖子 key
    likePaid: [],   // 已发放过"附议奖励"的 key。取消后再点赞不重复发钱，否则来回切换可无限刷鱼干
    memes: 0,
    draws: 0,
    pettedAt: 0,
    settings: { reduceMotion: false }
  };
}

var LEVELS = ['实习生','正式员工','小组长','主管','副校长'];
// 升级门槛：好感度
var LEVEL_NEED = [0, 12, 30, 60, 100];
// 好感度硬上限。**必须由 LEVEL_NEED 推导**，不能另写一个数字 ——
// 否则"我的"页的文字分母（/AFF_MAX）会和进度条分母（/100）分叉，
// 同一屏出现两个百分比（曾经的 150 vs 100 就是这个毛病）。
// 归一化夹取、加分夹取、进度条宽度三处统一引用本常量。
var AFF_MAX = LEVEL_NEED[LEVEL_NEED.length - 1];

/* 存档归一化 ------------------------------------------------------
   读存档和导入备份都走这里。旧版本缺字段、手工改坏、少写一层对象，
   都会在这一步被补齐成合法值，避免后面出现 undefined / NaN 把页面搞崩。
   注意：本段用到的 LEVELS / PHOTO_BY_ID 必须在这之前就已赋值——
   否则归一化自己会先抛错，而且只在"老用户"身上炸，最难发现。 */
function isNum(v){ return typeof v === 'number' && isFinite(v); }
function num(v, fb, min, max){
  if (!isNum(v)) v = fb;
  if (isNum(min) && v < min) v = min;
  if (isNum(max) && v > max) v = max;
  return v;
}
function str(v, fb){ return typeof v === 'string' ? v : fb; }
function isArr(v){ return Object.prototype.toString.call(v) === '[object Array]'; }
function arr(v){ return isArr(v) ? v : []; }
var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

function normalizeProfile(raw){
  var def = newProfile();
  if (!raw || typeof raw !== 'object') return def;
  return {
    version: 1,
    staffId: str(raw.staffId, def.staffId),
    dept: DEPT_BY_ID[raw.dept] ? raw.dept : def.dept,
    level: Math.floor(num(raw.level, 1, 1, LEVELS.length)),
    coins: Math.floor(num(raw.coins, 0, 0, 9999999)),
    joinedAt: DATE_RE.test(raw.joinedAt) ? raw.joinedAt : def.joinedAt,
    lastCheckIn: DATE_RE.test(raw.lastCheckIn) ? raw.lastCheckIn : '',
    streak: Math.floor(num(raw.streak, 0, 0, 99999)),
    nickname: str(raw.nickname, '').slice(0, 8),
    pokesToday: Math.floor(num(raw.pokesToday, 0, 0, 999)),
    pokesDate: DATE_RE.test(raw.pokesDate) ? raw.pokesDate : today(),
    feedToday: Math.floor(num(raw.feedToday, 0, 0, 9999)),
    feedDate: DATE_RE.test(raw.feedDate) ? raw.feedDate : today(),
    purrToday: Math.floor(num(raw.purrToday, 0, 0, 9999)),
    purrDate: DATE_RE.test(raw.purrDate) ? raw.purrDate : today(),
    exportClicks: Math.floor(num(raw.exportClicks, 0, 0, 99999))
  };
}
function normalizeState(raw){
  var def = newState();
  if (!raw || typeof raw !== 'object') return def;
  var al = (raw.album && typeof raw.album === 'object') ? raw.album : {};
  // 只保留真实存在的照片 id，并去重。
  // 注意这里必须认社区卡（c12 这种）：它们是从服务端拉回来的，
  // 启动那一刻还没拉，如果只认本地那 17 张，用户重开页面就会被删掉自己抽到的社区卡。
  var seen = {};
  var unlocked = arr(al.unlocked).filter(function(id){
    if (!isCardId(id) || seen[id]) return false;
    seen[id] = 1; return true;
  });
  if (!unlocked.length) unlocked = def.album.unlocked.slice();
  var fresh = arr(al.fresh).filter(function(id){ return isCardId(id); });
  return {
    album: { unlocked: unlocked, fresh: fresh },
    votes: (raw.votes && typeof raw.votes === 'object') ? raw.votes : {},
    feedings: arr(raw.feedings),
    affection: num(raw.affection, 0, 0, AFF_MAX),
    liked: arr(raw.liked),
    likePaid: arr(raw.likePaid),
    memes: Math.floor(num(raw.memes, 0, 0, 99999)),
    draws: Math.floor(num(raw.draws, 0, 0, 99999)),
    pettedAt: num(raw.pettedAt, 0, 0),   // 毫秒时间戳，只保证非负，不设上限
    settings: { reduceMotion: !!(raw.settings && raw.settings.reduceMotion) }
  };
}

// 一律过一遍归一化：新用户得到默认档案，老存档/被改坏的存档会被自动补齐
var P = normalizeProfile(read(LSK, null));
var S = normalizeState(read(LSKEY, null));
// save() 是本文件唯一的"状态变了"信号。共享层要上传工牌，就挂在这里，
// 而不是在签到/投票/撸猫等十几处逐个补一句 —— 少一处就是一个永远同步不上去的 bug。
function save(){ write(LSK, P); write(LSKEY, S); queuePush(); }

function levelName(l){ return LEVELS[Math.min(l, LEVELS.length) - 1] || '实习生'; }
function recalcLevel(){
  var lv = 1;
  for (var i = 0; i < LEVEL_NEED.length; i++){ if (S.affection >= LEVEL_NEED[i]) lv = i + 1; }
  if (lv !== P.level){ P.level = lv; return true; }
  return false;
}

function unlock(id, silent){
  if (S.album.unlocked.indexOf(id) >= 0) return false;
  S.album.unlocked.push(id);
  if (!silent) S.album.fresh.push(id);
  return true;
}
function lockedList(){ return PHOTOS.filter(function(p){ return S.album.unlocked.indexOf(p.id) < 0; }); }

/* ---------------------------------------------------------------
   音效：全部用 Web Audio 现合成，不依赖任何音频文件。
   好处：零体积、随时可用、也不会因为"文件没加载完"而时响时不响。
   AudioContext 必须在用户手势之后才能出声，所以懒创建 + 首次手势时 resume。
   --------------------------------------------------------------- */
var AC = null;
function ac(){
  if (AC) return AC;
  try {
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    AC = new C();
    if (AC.state === 'suspended') AC.resume();
  } catch (e){ AC = null; }
  return AC;
}
// 一旦有任何手势，立刻把 AudioContext 叫醒（iOS/安卓浏览器都要求手势后才许出声）
document.addEventListener('pointerdown', function(){ ac(); }, { once: false, passive: true });

function beep(freq, dur, type, vol, slideTo){
  var a = ac(); if (!a) return;
  var t = a.currentTime;
  var o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
// 有名字的音效入口。每个动作一个音色，短促、不烦人。
function sfx(name){
  if (document.hidden) return;             // 页面在后台就别响
  try {
    switch(name){
      case 'poke':   beep(540, 0.07, 'sine', 0.16, 300); break;                         // 戳：短促"啵"
      case 'purr':   beep(85, 0.65, 'sawtooth', 0.10, 128); beep(92, 0.65, 'sawtooth', 0.09, 136); break; // 撸：低频咕噜
      case 'feed':   beep(660, 0.08, 'square', 0.12); beep(880, 0.12, 'square', 0.10, undefined); break;   // 吃：咔嚓两口
      case 'pay':    beep(1318, 0.09, 'triangle', 0.15); beep(1760, 0.13, 'triangle', 0.11, undefined); break; // 扣鱼干：金币
      case 'deny':   beep(190, 0.18, 'square', 0.10, 120); break;                        // 超限/失败：低沉的"嗡"
      case 'draw':   beep(420, 0.34, 'sawtooth', 0.09, 1200); break;                     // 抽卡：上扬
      case 'check':  beep(784, 0.11, 'sine', 0.16); beep(1047, 0.18, 'sine', 0.14, undefined); break; // 签到
      case 'pop':    beep(700, 0.06, 'sine', 0.11, 520); break;                          // 发帖/评论/点赞/投票
      case 'up':     [523, 659, 784, 1047].forEach(function(f, i){ setTimeout(function(){ beep(f, 0.16, 'triangle', 0.14); }, i * 85); }); break; // 升级琶音
    }
  } catch (e){}
}

/* ---------------------------------------------------------------
   3b. 共享层 —— 让所有人看到同一份数据

   三种运行状态，靠「页面从哪儿打开的」自动判定，不需要用户做任何设置：
     · http(s) 打开 且 SHARE.url 留空  → 用同源接口（即 server/server.js，局域网共享）
     · SHARE.url 填了值                → 用那个地址（Supabase，公网共享）
     · file:// 直接打开 且 url 留空     → 单机模式，行为和原来的 P0 完全一样

   为什么要自动判定而不是加个开关：扫码的人只会打开一个网址，
   让他去理解"单机/共享"是多余的。网址长什么样，就决定了是什么模式。

   还有第四种情况：**界面挂在静态托管上**（GitHub Pages 之类）。
   那种宿主永远不会有 /rest/v1，但数据服务在另一个域名上活着。
   这里不加"看域名猜意图"的魔法 —— 就是先试同源，404 了就换 fallback 再试一次，
   正好复用下面那条已经验证过的判断（404 = 这个宿主没有共享接口）。
   --------------------------------------------------------------- */
var SHARE = {
  url:  '',              // 例 'https://abcdefgh.supabase.co'；留空 = 同源 / 或单机
  key:  '',              // Supabase 的 anon key；连本机 server.js 时不需要
  // 备用数据服务地址：界面挂静态托管时靠它。
  // 同源的 /rest/v1 必然是 404，于是自动切到这个地址继续（跨域读写已实测通过）。
  // 留空的话，静态托管上就只会退回单机模式。
  // ⚠️ 后端换地址了，这里要跟着改，否则 GitHub 上那份界面会退回单机。
  fallback: 'https://jzca-office.app.workbuddy.host',
  code: 'hz-art-2026'    // 写入共享码，必须和 schema.sql / server.js 里那个一致
};

var API = (function(){
  if (SHARE.url) return String(SHARE.url).replace(/\/+$/, '');
  var p = location.protocol;
  if (p === 'http:' || p === 'https:') return '';   // 同源，用相对路径
  return null;                                      // file:// → 单机
})();
var SHARED = API !== null;
// 备用地址只切一次。不做"来回反复试"——试过还是不行就老实退回单机
var switchedToFallback = false;

/* 微信内打开的识别。
   托管平台会把微信的 UA 整个拦掉（实测：同一个地址，普通浏览器 200，微信 UA 403 拦截页，
   连 /rest/v1 接口一起拦）—— 所以在微信里共享功能必然连不上，
   这不是网络抖动，重试一万次也不会通。
   界面本身走 GitHub Pages（GitHub 不拦微信），所以策略是：
   本机功能照常玩，共享功能明确指路"去浏览器打开"，而不是挂一条永远重试不成功的横幅。 */
var IN_WECHAT = /MicroMessenger/i.test(navigator.userAgent);

// 每台设备一个固定标识，作为「我是谁」。
// 不能用 crypto.randomUUID —— 它要求安全上下文，而局域网走的是 http，拿不到。
var UID = (function(){
  function gen(){ return 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  try {
    var k = 'jzca.uid', v = localStorage.getItem(k);
    if (!v){ v = gen(); localStorage.setItem(k, v); }
    return v;
  } catch (e){ return gen(); }
})();

function apiFetch(path, opt){
  opt = opt || {};
  var headers = {};
  // 只在真带 body 时才声明 Content-Type。
  // 给 GET 加上 `Content-Type: application/json` 会把跨域请求变成「非简单请求」，
  // 浏览器要先发一次 OPTIONS 预检 —— 连云端时每个读请求都平白多一个来回，
  // 而且预检是并发的，冷启动那一屏会明显变慢。本机同源没有这问题，所以只坑云端。
  if (opt.body !== undefined) headers['Content-Type'] = 'application/json';
  if (SHARE.key){
    headers['apikey'] = SHARE.key;
    headers['Authorization'] = 'Bearer ' + SHARE.key;
  }
  // 记下这一次用的是哪个基地址。切换备用地址之后，先前发出去的请求会陆续回来报 404 ——
  // 那些是**过期的失败**，不能让它们再触发一次降级（否则刚切过去就被打回单机）。
  var usedBase = API;
  return fetch(usedBase + path, {
    method: opt.method || 'GET',
    headers: headers,
    body: (opt.body === undefined) ? undefined : JSON.stringify(opt.body)
  }).then(function(r){
    return r.text().then(function(t){
      var d = null;
      try { d = t ? JSON.parse(t) : null; } catch (e){}
      if (!r.ok){
        var err = new Error((d && d.message) || ('HTTP ' + r.status));
        err.status = r.status;
        // 404 = 这个地址上压根没有共享接口（纯静态托管，或者地址填错了）。
        // 这跟"暂时连不上"是两回事：重试一万次也没用。
        if (r.status === 404) demoteNoBackend(usedBase);
        throw err;
      }
      return d;
    });
  });
}
function rpc(fn, args){ return apiFetch('/rest/v1/rpc/' + fn, { method: 'POST', body: args }); }
function sel(table, qs){ return apiFetch('/rest/v1/' + table + (qs ? '?' + qs : '')); }

// 云端缓存。null 表示「还没拉到」，和「拉到了但是空的」是两件事，别混
var remote = {
  votes: null,    // 今天的全部投票：[选项号, 选项号, ...]
  posts: {},      // deptId -> [帖子]
  comments: {},   // postId -> [评论]
  mylikes: null,  // 我附议过的帖子 key 列表，用来决定按钮点没点亮
  ccount: {},     // postId -> 评论条数，用来在按钮上显示"评论 3"
  board: null,    // 排行榜
  cards: null,    // 已过审的卡池照片（null = 还没拉到）
  pending: null,  // 待大家投票的投稿
  err: null
};

// 后端根本不存在时怎么办。三条出路，按顺序试：
//   1) 配了 fallback 且还没试过 → 切到 fallback 再试一次（界面挂静态托管时的正常路径）
//   2) 切过还是不行 / 没配 fallback → 安静地退回单机模式
// 什么时候会遇到 404：把整个文件夹传到静态托管（GitHub Pages、只想给人看设计）、
// 或者用某个预览服务打开这个 html —— 这些地址上没有 /rest/v1。
// 这和"服务暂时挂了"必须分开处理：后者要挂横幅提醒重试，前者重试一万次也没用。
var demoted = false;
function clearRemote(){
  remote.votes = null; remote.posts = {}; remote.comments = {};
  remote.mylikes = null; remote.ccount = {}; remote.board = null;
  remote.cards = null; remote.pending = null;
}
function demoteNoBackend(fromBase){
  // 只有一个条件成立时才处理：这次失败来自**当前**基地址。
  // 切换之后旧地址的响应陆续回来，那些失败要忽略掉
  if (fromBase !== API) return;
  if (!switchedToFallback && !SHARE.url && SHARE.fallback){
    switchedToFallback = true;
    API = String(SHARE.fallback).replace(/\/+$/, '');
    clearRemote();
    remote.err = null;
    // 静默重试：用户不需要知道背后换了数据服务，他只该看到"能用"
    setTimeout(function(){ pullFor(); }, 0);
    return;
  }
  if (demoted) return;
  demoted = true;
  SHARED = false;
  remote.err = null;          // 这不是错误，是本就不该联网
  // 发帖按钮、排行榜、同步提示都会随之消失，所以要说一句，别让人以为功能丢了
  sayLater('这个地址没有共享服务，已切回本机模式');
}

// 后端返回的图片地址是相对路径（/cardimg/3）。界面挂在别的域名上时，
// 相对路径会指向**那个**域名 —— 图片全裂。所以统一补上数据服务的地址。
// 云端（Supabase Storage）返回的是绝对地址，原样放行。
function absUrl(u){
  if (!u) return u;
  if (/^https?:/i.test(u)) return u;
  return u.charAt(0) === '/' ? (API + u) : u;
}

// 启动页还盖着的时候先攒着，等主界面出来了再说 ——
// 否则这句话会被启动动画盖过去，等于没说
var pendingSay = null;
function sayLater(msg){
  var m = $('#main');
  if (m && !m.classList.contains('hidden')){ toast(msg); return; }
  pendingSay = msg;
}

function agoText(iso){
  var t = Date.parse(iso);
  if (!t) return '';
  var d = new Date(t), td = new Date();
  var hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  function same(a, b){ return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  if (same(d, td)) return '今天 ' + hm;
  if (same(d, new Date(td.getTime() - 86400000))) return '昨天 ' + hm;
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm;
}
// 把数据库的一行变成页面里 postHTML 认识的样子

    sel('jzca_cards', 'status=eq.approved&select=id,uid,author,name,desc,cat,r,img&order=created_at.desc&limit=200'),

/* ---------------------------------------------------------------
   3c. 数据的"读法" —— 页面只关心数据长什么样，不关心它从哪来

   这一层存在的意义：下面所有渲染函数都只问这里要数据，
   于是"单机"与"共享"的差别被收敛在这几个函数里，
   不会出现"某处忘了判断 SHARED，两套逻辑互相打架"的情况。
   --------------------------------------------------------------- */

// 百分比用「最大余数法」。直接对每项 Math.round 会算出 33/33/33=99 这种
// 加起来不满 100 的投票结果 —— 这是投票界面最不该有的瑕疵。
function pctOf(counts){
  var n = counts.length, i, total = 0;
  for (i = 0; i < n; i++) total += counts[i];
  if (!total) return counts.map(function(){ return 0; });
  var raw = counts.map(function(c){ return c / total * 100; });
  var out = raw.map(Math.floor);
  var rest = 100 - out.reduce(function(a, b){ return a + b; }, 0);
  var order = raw.map(function(v, k){ return { k: k, frac: v - Math.floor(v) }; })
                 .sort(function(a, b){ return b.frac - a.frac; });
  for (i = 0; i < rest; i++) out[order[i % n].k]++;
  return out;
}
// 每个选项各得几票。共享模式用服务端真实票数；单机模式用按日期固定的演示票数。
// 关键点：一次算完全部选项，返回「票数」而不是「百分比」。
// 原实现是每个选项各自调一次百分比、并给自己那一票 +12，于是每个选项的
// 分母都不一样，加起来也不是 100 —— 纯粹的显示 bug，不是数据问题。
function voteCounts(n){
  var i, out = [];
  if (SHARED && remote.votes){
    for (i = 0; i < n; i++) out.push(0);
    remote.votes.forEach(function(op){
      var k = parseInt(op, 10);
      if (k >= 0 && k < n) out[k]++;
    });
    return out;
  }
  var q = todayTopic()[0];
  for (i = 0; i < n; i++) out.push(6 + Math.round(seeded(q + ':' + today(), i) * 30));
  return out;
}

// "我投的是哪一项"。选项 0 是合法选项但 falsy，
// 所以任何地方都不能写成 if (voted) —— 那会让"投了第 1 项"看起来像没投。
function votedOpt(){
  var v = S.votes[today()];
  if (v === undefined || v === null || v === '') return null;
  var k = parseInt(v, 10);
  return isNaN(k) ? null : k;
}

// 在共享区里显示的名字。
// 没署名时**不能**显示"未署名"—— 全画室的帖子和排行榜上挂满"未署名"，
// 看起来就像系统坏了，而不是有人没起名。用工牌尾号兜底：
// 既不为空，又不像真名，正好符合"这里是员工编号"的设定。
function displayName(){
  var n = String(P.nickname || '').trim();
  if (n) return n;
  var tail = String(P.staffId || '').slice(-4);
  return tail ? ('员工 ' + tail) : '匿名员工';
}

// 帖子的唯一键：服务端帖子有 id，用 id 最稳；预置演示帖没有 id，退回 部门:标题。
// 这样老的点赞记录（按 dept:标题 存）不需要迁移就能继续用。
function postKey(p, deptId){ return (p && p.id != null) ? ('p' + p.id) : (deptId + ':' + p.t); }

// 某个部门的帖子：共享模式下优先用服务端数据；还没拉到或拉失败时退回预置内容。
// 「退回」这件事是刻意的 —— 一个连不上服务器的页面，最好的表现是像以前一样能用，
// 而不是空白。所以这里不返回 null，只在页顶挂一条 syncNote 说明实情。
function feedOf(deptId){
  if (SHARED && remote.posts[deptId]) return remote.posts[deptId];
  return POSTS[deptId] || [];
}

// 这一帖我附议过没有。共享模式下以服务端为准（换台设备也不会丢），
// 服务端列表还没拉到时退回本机记录。
function likedOf(p, deptId){
  var k = postKey(p, deptId);
  if (SHARED && p && p.id != null && remote.mylikes) return remote.mylikes.indexOf(k) >= 0;
  return S.liked.indexOf(k) >= 0;
}

// 同步失败的提示条。它同时是重试按钮 —— 只说"连不上"而不给出路，
// 用户下一步只能去刷新页面，那等于把问题推回去。
// 顺带把服务端/网络给的原话带出来：部署时"HTTP 401"（密钥不对）和
// "Failed to fetch"（根本连不上）要查的方向完全不同，只写"失败"等于没说。
function syncNote(){
  if (!SHARED || !remote.err) return '';
  var msg = String(remote.err);
  // 微信里被平台拦是常态（403），重试没有意义 —— 指路比挂横幅有用
  if (IN_WECHAT && msg.indexOf('403') >= 0){
    return '<div class="sync-note wx">微信里连不上共享数据，本机功能照常玩'
      + '<span class="why">要投票 / 发帖 / 排行榜：点右上角「···」→ 在浏览器打开</span></div>';
  }
  return '<button class="sync-note" data-act="retrySync">⚠️ 连不上共享服务 · 点这里重试'
    + '<span class="why">' + esc(msg.slice(0, 80)) + '</span></button>';
}

// 哪个页面要拉哪些数据，只在这一处声明。
// 好处：网络请求不会散落到十几个渲染函数里，将来加页面也不会漏掉。
function pullFor(){
  if (!SHARED) return;
  // 每次拉取前先清掉上一次的失败标记：网络抖一下不应该让提示条永久挂着。
  // 真失败的话，下面任何一个 catch 会立刻把它重新置上。
  remote.err = null;
  var jobs = [];
  if (cur === 'home'){
    // 首页同时要四样：投票、办公室帖子、我点过的赞、各帖评论数。
    // 四个请求并发发出，总耗时约等于最慢的那个，不是相加。
    jobs.push(pullVotes(), pullPosts('office'), pullLikes(), pullCounts());
  } else if (cur === 'dept' && deptView){
    jobs.push(pullPosts(deptView), pullLikes(), pullCounts());
  } else if (cur === 'me'){
    jobs.push(pullBoard());
  } else if (cur === 'studio'){
    // 图鉴要卡池，表情包工厂不用 —— 但两个子页共用一个 Tab，一起拉最省事，
    // 代价只是一个几十字节的请求
    jobs.push(pullCards());
  }
  if (!jobs.length) return;
  var mark = cur + '|' + (deptView || '');
  Promise.all(jobs).then(function(){
    // 数据回来时用户可能已经切走了。那就别重画 ——
    // 重画会把撸猫页正在进行的"按住撸背"等交互打断。
    if (mark === (cur + '|' + (deptView || ''))) render();
  });
}

// 把「我」同步上去。save() 之后 3 秒内的连续改动合并成一次请求 ——
// 戳猫 20 连击不该打出 20 个 HTTP 请求。
var pushTimer = 0;
function queuePush(){
  if (!SHARED) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(function(){ pushTimer = 0; pushMe(); }, 3000);
}
// 立刻把还没发出去的那次同步发掉。
// 场景：签到后 1 秒就切到别的 App —— 手机上这是常态，不能等到 3 秒计时器。
function flushPush(){
  if (!SHARED || !pushTimer) return;
  clearTimeout(pushTimer);
  pushTimer = 0;
  pushMe();
}

/* ---------------------------------------------------------------
   4. 启动流程
   --------------------------------------------------------------- */
var obStatus = $('#obStatus'), obBar = $('#obBar'), obPaw = $('#obPaw'),
    obCard = $('#obCard'), obCardText = $('#obCardText'), obEnter = $('#obEnter');

// 探测"是否首次进来"。这是全文件唯一一处必须直接碰 localStorage 的地方
// （其余读写都走 read()/write() 的 try 兜底），所以同样必须兜住：
// 浏览器禁用站点数据时（隐私模式、企业策略、Edge 的"阻止站点数据"），
// 裸调 getItem 会抛异常，而异常发生在 IIFE 顶层 —— 整个应用直接白屏。
var storageOk = true;      // 本地存储是否可用，用于给出一次性的提示
var storageWarned = false; // 提示只弹一次
var isNew = false;
try { isNew = !localStorage.getItem(LSK); }
catch(e){ storageOk = false; isNew = true; }

// 存储不可用时要主动告诉用户"这次的东西不会留下"，
// 否则他会以为进度丢了是 bug。必须等界面上没有遮挡物时再弹。
// 共享模式下还要多说一句：身份标识也是存 local storage 的，存不了就意味着
// 他每打开一次都会被当成一个新人 —— 榜单上会多出一个影子，而且"一天一票"也挡不住他。
function warnNoStorage(){
  if (storageOk || storageWarned) return;
  storageWarned = true;
  toast(SHARED
    ? '这个浏览器禁用了本地存储：进度不会保存，共享区里的身份也只对本次有效'
    : '这个浏览器禁用了本地存储，这次的进度不会被保存');
}

function runOnboard(){
  var steps = [
    {t:'正在为你制作工牌…', p:22},
    {t:'正在核对部门编制…', p:52},
    {t:'正在确认校长状态…', p:78},
    {t:'工牌已发放。', p:100}
  ];
  var i = 0;
  function next(){
    if (i >= steps.length){ finish(); return; }
    var s = steps[i++];
    obStatus.textContent = s.t;
    obBar.style.width = s.p + '%';
    setTimeout(next, i === 1 ? 700 : 620);
  }
  function finish(){
    var d = DEPT_BY_ID[P.dept];
    obCardText.textContent = '工牌编号 #' + P.staffId.split('-').pop() + ' · ' + d.n + ' · ' + levelName(P.level);
    obPaw.classList.add('stamp');
    vibe(24);
    obCard.classList.add('on');
    setTimeout(function(){ obEnter.classList.add('on'); }, 380);
    setTimeout(function(){ if (isNew) go(true); }, 1400); // 新用户自动进入
  }
  setTimeout(next, 620);
}

var wentIn = false;
function go(auto){
  // 幂等保护：新用户会先自动进入，而"进入办公室"按钮在那之前就可见了。
  // 两处都触发过一次，就会把用户已经关掉的引导层重新弹回来。
  if (wentIn) return;
  wentIn = true;
  $('#onboard').classList.add('out');
  setTimeout(function(){
    $('#onboard').style.display = 'none';
    $('#main').classList.remove('hidden');
    render();
    if (isNew) setTimeout(function(){ $('#guide').classList.add('on'); }, auto ? 420 : 300);
    else setTimeout(warnNoStorage, 600);   // 老用户没有引导层遮挡，直接提示
    if (pendingSay){ toast(pendingSay); pendingSay = null; }   // 攒下来的那句话，到这里才说得出口
  }, auto ? 560 : 0);
}

$('#guideOk').addEventListener('click', function(){
  $('#guide').classList.remove('on');
  // 原来这里只写 LSK（档案），没写状态键 —— 一旦启动时的 save() 变成有条件执行，
  // 就会留下"档案存了、状态没存"的半截存档。统一走 save() 保证两个键同时落盘。
  save();
  setTimeout(warnNoStorage, 500);          // 等引导层退干净再提示
});
obEnter.addEventListener('click', function(){ go(false); });

var TAB_TITLE = {home:'校长办公室', cat:'撸猫', dept:'部门', studio:'剪辑室', me:'我的'};

  render();
  window.scrollTo(0,0);

function nowHM(){
  var d = new Date();
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

// 投票结果的"演示占比"：同一天同一题固定，保证每次打开一致。
// 真实票数与演示票数的分流在 voteCounts()，这里只负责把票数换算成百分比。
function topicOptHTML(label, i, voted, pcts){
  var isVoted = (voted !== null && voted !== undefined);
  var picked = isVoted && i === voted;
  var h = '<button class="opt' + (picked ? ' picked' : '') + '" data-act="vote" data-i="' + i + '"';
  if (isVoted) h += ' disabled';
  h += '>';
  h += '<span class="fill" style="width:' + (isVoted ? pcts[i] : 0) + '%"></span>';
  h += '<span class="lbl"><span>' + esc(label) + '</span>';
  if (isVoted) h += '<span class="pct">' + pcts[i] + '%</span>';
  h += '</span></button>';
  return h;
}
// 一次算出整题的结果。返回 total 是为了在界面上写"共 N 人参与"，
// 顺便让"百分比确实基于 N 张票"这件事可以被直接看到。
function topicOptsHTML(voted){
  var opts = todayTopic()[1];
  var counts = voteCounts(opts.length);
  var pcts = pctOf(counts);
  var isVoted = (voted !== null && voted !== undefined);
  var total = 0, i;
  for (i = 0; i < counts.length; i++) total += counts[i];
  var h = '';
  for (i = 0; i < opts.length; i++) h += topicOptHTML(opts[i], i, voted, pcts);
  return { html: h, total: isVoted ? total : 0 };
}

function doVote(i){
  if (votedOpt() !== null){ toast('今天已经投过了'); return; }
  // 先写本地，界面立刻有反应；服务端失败再回滚 —— 不让用户对着转圈干等
  S.votes[today()] = i;
  save();
  paintTopic();
  addCoin(8, '投票 +8 鱼干');
  sfx('pop');
  if (!SHARED) return;
  rpc('jzca_vote', { p_code: SHARE.code, p_uid: UID, p_day: today(), p_opt: i })
    .then(function(ok){
      if (ok === false){
        // 服务端说今天已经投过（多半是换了手机、或清了缓存）。
        // 这种时候要相信服务端，并把本机这一票对齐过去，否则两台设备显示不一致。
        toast('今天已经投过了，正在同步你那台设备上的票');
        return pullVotes();
      }
      // 自己那一票要计入统计，否则"共 N 人参与"永远少一个人
      if (remote.votes) remote.votes.push(i);
      return remote.votes ? null : pullVotes();
    })
    .then(function(){ paintTopic(); })
    .catch(function(e){
      // 回滚。宁可显示"没投过"，也不能让界面显示一个服务端并不存在的票
      remote.err = String(e.message || e);
      delete S.votes[today()];
      save();
      paintTopic();
      toast('投票没发出去：' + (e.message || e));
    });
}
// 整块议题（含标题、选项、结果脚注）。
// 抽成独立函数是为了让"投票之后只重画这一块"成为可能 ——
// 只改选项不更新脚注的话，"共 N 人参与"会一直停在投前那个数字。
function topicBlockHTML(voted){
  var topic = todayTopic();
  var tv = topicOptsHTML(voted);
  var h = '<div class="tp-k">每日议题 · 第 ' + topicNo() + ' 期</div>';
  h += '<div class="tp-q">' + esc(topic[0]) + '</div>';
  h += '<div class="tp-opts">' + tv.html + '</div>';
  if (voted !== null){
    h += '<div class="tiny" style="margin-top:10px">已投票 · '
      + (SHARED ? '共 ' + tv.total + ' 人参与' : '结果仅为演示数据，本机模式不联网')
      + '</div>';
  }
  return h;
}
// 只重画议题这一块，不整页重画 —— 整页重画会把滚动位置和动效一起打断
function paintTopic(){
  var box = $('#topicBox');
  if (box) box.innerHTML = topicBlockHTML(votedOpt());
}
function addCoin(n, msg){
  P.coins += n; save();
  var el = $('#coinChip');
  if (el) el.textContent = '🐟 ' + P.coins;
  bumpCoin();
  if (msg) toast(msg);
}
function spendCoin(n){
  if (P.coins < n){ toast('鱼干不够，去签到或撸猫赚一点'); return false; }
  P.coins -= n; save();
  var el = $('#coinChip');
  if (el) el.textContent = '🐟 ' + P.coins;
  bumpCoin();
  return true;
}

function doCheckin(){
  var t = today();
  if (P.lastCheckIn === t){ toast('今天已经签过了'); return; }
  var y = new Date(Date.now() - 86400000);
  var ymd = y.getFullYear() + '-' + pad2(y.getMonth()+1) + '-' + pad2(y.getDate());
  P.streak = (P.lastCheckIn === ymd) ? P.streak + 1 : 1;
  P.lastCheckIn = t;
  P.coins += 10;
  var extra = '';
  if (P.streak % 7 === 0){
    var lk = lockedList();
    if (lk.length){
      var got = lk[rint(lk.length)];
      unlock(got.id);
      extra = ' · 解锁「' + got.n + '」';
    }
  }
  save();
  vibe(18);
  render();
  toast('签到成功 +10 鱼干 · 连续 ' + P.streak + ' 天' + extra);
  sfx('check');
}

function postHTML(p, deptId){
  var k = postKey(p, deptId);
  var pid = (p.id != null) ? p.id : '';
  var liked = likedOf(p, deptId);
  var isUser = p.kind === 'user';
  // 服务端帖子的赞数由服务端每次全量重算，直接信它；
  // 预置演示帖没有服务端记录，只能在本机记录上叠加。
  // 两者用同一个按钮，但计数口径必须分开写 —— 混在一起就会"自己点的赞算两次"。
  var nLike = (SHARED && pid !== '') ? (p.lk || 0) : ((p.lk || 0) + (liked ? 1 : 0));
  var nCmt = (pid !== '') ? (remote.ccount['p' + pid] || 0) : 0;

  var h = '<div class="post">';
  h += '<div class="post-h">';
  h +=   '<div class="post-av">🐾</div>';
  h +=   '<div style="flex:1;min-width:0"><div class="who">' + esc(p.w) + '</div><div class="when">' + esc(p.ago) + '</div></div>';
  if (!isUser) h += '<span class="pill demo">演示数据</span>';
  h += '</div>';
  h += '<div class="post-t">' + esc(p.t) + '</div>';
  h += '<div class="post-c">' + esc(p.c) + '</div>';
  h += '<div class="post-f">';
  h +=   '<button data-act="like" data-k="' + esc(k) + '" data-pid="' + pid + '" data-dept="' + esc(deptId) + '" class="' + (liked ? 'on' : '') + '">'
       +     '附议 <span>' + nLike + '</span></button>';
  h +=   '<button data-act="comment" data-pid="' + pid + '" data-dept="' + esc(deptId) + '">'
       +     '评论' + (nCmt ? ' <span>' + nCmt + '</span>' : '') + '</button>';
  h += '</div></div>';
  return h;
}
function doLike(k, pid, deptId){
  var was = S.liked.indexOf(k) >= 0;
  if (was){
    S.liked.splice(S.liked.indexOf(k), 1);
  } else {
    S.liked.push(k);
    // 附议奖励只发一次：取消后再点不再发钱，否则来回切换就能无限刷鱼干
    if (S.likePaid.indexOf(k) < 0){ S.likePaid.push(k); addCoin(1); }
    sfx('pop');
  }
  save();
  // 预置演示帖没有服务端记录，本机记账就够了
  if (!SHARED || !pid){ render(); return; }
  // 共享帖：服务端才是准的。乐观更新先跑，失败再翻回来
  rpc('jzca_like', { p_code: SHARE.code, p_uid: UID, p_post_id: Number(pid) })
    .then(function(n){
      (remote.posts[deptId] || []).forEach(function(p){
        if (String(p.id) === String(pid)) p.lk = n;
      });
      if (remote.mylikes){
        var i = remote.mylikes.indexOf(k);
        if (was && i >= 0) remote.mylikes.splice(i, 1);
        if (!was && i < 0) remote.mylikes.push(k);
      }
      render();
    })
    .catch(function(e){
      // 服务端没收下，就得把本机的乐观改动翻回来，
      // 否则按钮会一直亮着、数字也一直多一个
      remote.err = String(e.message || e);
      var i = S.liked.indexOf(k);
      if (was && i < 0) S.liked.push(k);
      if (!was && i >= 0) S.liked.splice(i, 1);
      save(); render();
      toast('附议没发出去：' + (e.message || e));
    });
}

/* --- 评论：列表在底部弹层里，不再占帖子高度 --- */
var cmtState = { pid: null, dept: null, failed: false };

function openComments(pid, deptId){
  // 预置演示帖没有服务端 id，评论无处可挂。说清楚原因，别给一个点了没反应的按钮
  if (!SHARED || !pid){ toast('这是预置演示内容，评论需要服务端，扫码进来的版本才有'); return; }
  cmtState.pid = Number(pid);
  cmtState.dept = deptId;
  cmtState.failed = false;
  openSheet(
    '<div class="sheet-title">评论</div>'
    + '<div class="sheet-sub" id="cmtSub">正在加载…</div>'
    + '<div id="cmtList"></div>'
    + '<div style="display:flex;gap:8px;margin-top:13px;align-items:flex-start">'
    +   '<input class="txt" id="cmtInput" maxlength="200" placeholder="说点什么，200 字以内">'
    +   '<button class="btn sm" id="cmtSend" style="flex:0 0 72px">发送</button>'
    + '</div>'
  );
  var send = $('#cmtSend');
  if (send) send.addEventListener('click', sendComment);
  var inp = $('#cmtInput');
  if (inp) inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') sendComment(); });
  paintComments();                                     // 有缓存就先画，没缓存会显示"正在加载…"
  pullComments(cmtState.pid).then(function(){
    // 拉失败时 pullComments 不会往缓存里写，所以"缓存还是空的"就等价于"这次没拉到"。
    // 必须把这两种状态分开：一直转圈"正在加载…"和"加载失败"在用户眼里是两回事，
    // 前者会让人一直等下去。
    if (!remote.comments[cmtState.pid]) cmtState.failed = true;
    if ($('#cmtList')) paintComments();                // 弹层可能已被关掉，先确认节点还在
  });
}
function paintComments(){
  var list = $('#cmtList'), sub = $('#cmtSub');
  var rows = remote.comments[cmtState.pid];
  if (!rows){
    if (sub) sub.textContent = cmtState.failed ? '没拉到' : '正在加载…';
    if (list && cmtState.failed){
      list.innerHTML = '<div class="tiny" style="padding:14px 0">连不上共享服务，暂时看不到评论。<br>网络好了再点进来一次。</div>';
    }
    return;
  }
  if (sub) sub.textContent = rows.length ? ('共 ' + rows.length + ' 条') : '还没有人说话';
  if (!list) return;
  if (!rows.length){
    list.innerHTML = '<div class="tiny" style="padding:14px 0">第一条留给你。</div>';
    return;
  }
  list.innerHTML = rows.map(function(c){
    return '<div class="cmt">'
      + '<div class="cmt-h"><b>' + esc(c.author) + '</b><span>' + esc(agoText(c.created_at)) + '</span></div>'
      + '<div class="cmt-b">' + esc(c.body) + '</div>'
      + '</div>';
  }).join('');
}
function sendComment(){
  var inp = $('#cmtInput'), btn = $('#cmtSend');
  var v = inp ? String(inp.value || '').trim() : '';
  if (!v){ toast('先写点什么'); return; }
  if (v.length > 200){ toast('太长了，200 字以内'); return; }
  if (btn){ btn.disabled = true; btn.textContent = '发送中'; }
  // 先清空输入框：成功了还留着原文，用户会以为没发出去又发一遍
  if (inp) inp.value = '';
  rpc('jzca_comment', {
    p_code: SHARE.code, p_uid: UID, p_author: displayName(),
    p_post_id: cmtState.pid, p_body: v
  })
    .then(function(){ return pullComments(cmtState.pid); })
    .then(function(){
      if (btn){ btn.disabled = false; btn.textContent = '发送'; }
      paintComments();
      setCommentCount(cmtState.pid, (remote.comments[cmtState.pid] || []).length);
      sfx('pop');
      toast('说完了');
    })
    .catch(function(e){
      if (btn){ btn.disabled = false; btn.textContent = '发送'; }
      // 失败要把内容还给用户，不然等于让他重打一遍
      if (inp) inp.value = v;
      remote.err = String(e.message || e);
      toast('没发出去：' + (e.message || e));
    });
}
// 只改那一颗按钮上的数字，不整页重画 —— 用户还在弹层里，重画会让列表闪一下
function setCommentCount(pid, n){
  remote.ccount['p' + pid] = n;
  $$('.post-f [data-act="comment"]').forEach(function(b){
    if (String(b.dataset.pid) === String(pid)){
      b.innerHTML = '评论' + (n ? ' <span>' + n + '</span>' : '');
    }
  });
}

var catState = { photo: 't16', busy: false };
var wantFeed = false;   // 从首页"投喂"快捷入口进来时置位，撸猫页挂载后脉冲提示投喂区

  h += '</div>';
  h += '<div class="cat-veil"></div>';

  h +=   '<div class="aff-bar"><i id="affBar"></i></div>';
  h += '</div>';
  h += '<div class="drop-zone" id="dropZone"></div>';
  h += '<div class="cat-hint" id="catHint">';
  h +=   '<div class="ring">👆</div>';
  h +=   '<div class="tx">戳它 · 长按撸背</div>';
  h += '</div>';
  h += '<div class="hold-ring" id="holdRing">';

  h +=   '</svg>';
  h += '</div>';
  h += '<div class="cat-say" id="catSay"></div>';

  });
  h +=   '</div>';
  h +=   '<div class="feed-note" id="feedNote"></div>';

function mountCat(){
  var stage = $('#catStage'), img = $('#catImg');
  // 兜底：清掉上一次没清理干净的拖拽残影。
  // 正常流程不会剩，但只要剩一个，它就会一直叠在屏幕上（实拍 bug 就是这么一屏叠了五个）
  $$('.ghost-feed').forEach(function(g){ g.remove(); });
  var affBar = $('#affBar');
  var hint = $('#catHint'), holdRing = $('#holdRing'), holdArc = $('#holdArc');
  var sayEl = $('#catSay'), lineEl = $('#catLine'), zone = $('#dropZone');
  if (!stage) return;

  setTimeout(function(){ if (affBar) affBar.style.width = Math.round(S.affection / AFF_MAX * 100) + '%'; }, 60);

  // 投喂额度说明：免费剩余次数，用完就提示要花鱼干
  function paintFeedNote(){
    var el = $('#feedNote'); if (!el) return;
    var left = FEED_FREE_DAILY - P.feedToday;
    el.textContent = left > 0
      ? ('今日免费投喂剩 ' + left + ' 次，之后每次花鱼干')
      : '今日免费次数已用完，投喂需花鱼干';
  }
  paintFeedNote();

  // 由首页"投喂"快捷入口进来：脉冲提示投喂区，并把操作说清楚
  if (wantFeed){
    wantFeed = false;
    var feedRow = $('.feed-row');
    if (feedRow){
      feedRow.classList.add('attn');
      setTimeout(function(){ feedRow.classList.remove('attn'); }, 3200);
    }
    if (lineEl) lineEl.textContent = '按住一样吃的，拖到它面前再松手';
    if (hint) hint.classList.add('gone');
  }

  function say(txt){
    sayEl.innerHTML = '<span>' + esc(txt) + '</span>';
    setTimeout(function(){ if (sayEl.firstChild) sayEl.innerHTML = ''; }, 2400);
  }
  function fx(emoji, x, y){
    var e = document.createElement('div');
    e.className = 'emoji-fx';
    e.textContent = emoji;
    e.style.left = x + 'px';
    e.style.top = y + 'px';
    stage.appendChild(e);
    setTimeout(function(){ e.remove(); }, 1050);
  }
  function swapPhoto(id){
    if (!PHOTO_BY_ID[id]) return;
    catState.photo = id;
    img.classList.add('swap');
    setTimeout(function(){
      img.src = 'assets/' + id + '.jpg';
      img.onload = function(){ img.classList.remove('swap'); };
      setTimeout(function(){ img.classList.remove('swap'); }, 320);
    }, 150);
  }
  function bumped(delta){
    S.affection = Math.max(0, Math.min(AFF_MAX, S.affection + delta));
    var up = recalcLevel();
    save();
    // 进度条与"我的"页的文字共用 AFF_MAX 这一个分母，两处永远同比例
    if (affBar) affBar.style.width = Math.round(S.affection / AFF_MAX * 100) + '%';
    if (up){
      var hud = $('.cat-hud .lv');
      if (hud) hud.textContent = '好感度 Lv.' + P.level + ' · ' + levelName(P.level);
      sfx('up');
      toast('职级提升：' + levelName(P.level));
    }
  }

  /* --- 戳：按区域分头部/身体/尾巴 --- */
  var downT = 0, downX = 0, downY = 0, holding = false, holdStart = 0, holdRAF = 0;

  function regionOf(y){
    var h = stage.clientHeight;
    if (y < h * 0.42) return 'head';
    if (y < h * 0.72) return 'body';
    return 'tail';
  }
  function doPoke(x, y){
    if (catState.busy) return;
    catState.busy = true;
    setTimeout(function(){ catState.busy = false; }, 320);

    var reg = regionOf(y);
    var r = pick(POKE[reg]);
    swapPhoto(r[1]);
    say(r[0]);
    fx(pick(['✨','💢','🐾','💤','❓']), x - 13, y - 20);
    sfx('poke');
    vibe(14);

    // 每天戳的前 20 次给好感度，避免无限刷
    var t = today();
    if (P.pokesDate !== t){ P.pokesDate = t; P.pokesToday = 0; }
    if (P.pokesToday < 20){
      P.pokesToday++;
      bumped(1);
      if (lineEl) lineEl.textContent = '好感度 +1 · 今日剩余 ' + (20 - P.pokesToday) + ' 次';
    } else {
      if (lineEl) lineEl.textContent = '它今天被戳够了，不太想理你';
    }
    if (hint) hint.classList.add('gone');
  }

  stage.addEventListener('pointerdown', function(e){
    downT = Date.now(); downX = e.clientX; downY = e.clientY;
    holding = true; holdStart = Date.now();
    var rect = stage.getBoundingClientRect();
    var ly = e.clientY - rect.top;
    holdRing.style.left = (e.clientX - rect.left) + 'px';
    holdRing.style.top = ly + 'px';
    holdRing.classList.add('on');
    if (hint) hint.classList.add('gone');
    cancelAnimationFrame(holdRAF);
    (function tick(){
      if (!holding) return;
      var p = Math.min(1, (Date.now() - holdStart) / 1600);
      holdArc.setAttribute('stroke-dashoffset', String(264 * (1 - p)));
      if (p >= 1){ holding = false; holdRing.classList.remove('on'); purr(); return; }
      holdRAF = requestAnimationFrame(tick);
    })();
  });
  stage.addEventListener('pointerup', function(e){
    holding = false;
    cancelAnimationFrame(holdRAF);
    holdRing.classList.remove('on');
    holdArc.setAttribute('stroke-dashoffset', '264');
    var moved = Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY);
    if (Date.now() - downT < 420 && moved < 14){
      var rect = stage.getBoundingClientRect();
      doPoke(e.clientX - rect.left, e.clientY - rect.top);
    }
  });
  stage.addEventListener('pointercancel', function(){
    holding = false; cancelAnimationFrame(holdRAF); holdRing.classList.remove('on');
  });
  stage.addEventListener('pointerleave', function(){
    holding = false; cancelAnimationFrame(holdRAF); holdRing.classList.remove('on');
  });

  function purr(){
    if (Date.now() - S.pettedAt < 4000){ sfx('deny'); toast('它刚被撸过，让它歇一会'); return; }
    // 每天撸猫上限：不加限制的话，长按撸背能无限刷好感度，职级形同虚设
    var td = today();
    if (P.purrDate !== td){ P.purrDate = td; P.purrToday = 0; }
    if (P.purrToday >= PURR_DAILY){
      sfx('deny');
      toast('它今天被撸够了（每天 ' + PURR_DAILY + ' 次），明天再来');
      if (lineEl) lineEl.textContent = '它今天被撸够了，不太想理你';
      return;
    }
    P.purrToday++;
    S.pettedAt = Date.now();
    bumped(3);
    vibe([18, 40, 18]);
    sfx('purr');
    fx('🎵', stage.clientWidth/2 - 13, stage.clientHeight * 0.44);
    say('咕噜咕噜……');
    if (lineEl) lineEl.textContent = '它发出了咕噜声 · 好感度 +3（今日还剩 ' + (PURR_DAILY - P.purrToday) + ' 次）';
    swapPhoto(pick(['t12','t13','t05']));
  }

  /* --- 拖拽投喂 ---
     监听挂在**按钮自己**身上，并用 setPointerCapture 把后续指针事件抓到这个按钮：
     · 手指滑出按钮、滑到猫身上，事件都还在，不会丢
     · 松手/被系统取消，事件也一定回到这里
     之前挂在 document 上、且没处理「指针被取消」——手机上一旦接电话/边缘滑动/浏览器手势，
     松手事件就永远不会来，残影留在屏幕上越积越多，下一次拖拽的状态也会被顶掉（实拍 bug）。 */
  var drag = null, ghost = null;

  // 收尾：不管拖成没拖成，残影和状态都要清干净
  function endDrag(cancelled){
    if (drag && drag.btn) drag.btn.classList.remove('dragging');
    if (ghost){ ghost.remove(); ghost = null; }
    zone.classList.remove('near');
    if (cancelled && lineEl) lineEl.textContent = '投喂中断 · 未扣除';
    drag = null;
  }

  $$('.feed-btn').forEach(function(btn){
    btn.addEventListener('pointerdown', function(e){
      e.preventDefault();
      var f = FEEDS.filter(function(x){ return x.id === btn.dataset.feed; })[0];
      if (!f) return;
      // 按下时就拦：免费额度用没用完、鱼干够不够，当场说清楚，别让人拖到一半才失败
      var td = today();
      if (P.feedDate !== td){ P.feedDate = td; P.feedToday = 0; }
      var isFree = P.feedToday < FEED_FREE_DAILY;
      if (!isFree && P.coins < f.cost){
        sfx('deny');
        toast('今天免费次数用完了，投一次要 ' + f.cost + ' 鱼干，你的不够');
        if (lineEl) lineEl.textContent = '今天免费次数用完了，投一次要 ' + f.cost + ' 鱼干，你的不够';
        return;
      }
      btn.classList.add('dragging');
      ghost = document.createElement('div');
      ghost.className = 'ghost-feed';
      ghost.textContent = f.ic;
      ghost.style.left = e.clientX + 'px';
      ghost.style.top = e.clientY + 'px';
      document.body.appendChild(ghost);
      drag = { f: f, btn: btn, free: isFree };
      try { btn.setPointerCapture(e.pointerId); } catch (err){}
      if (hint) hint.classList.add('gone');
    });
    btn.addEventListener('pointermove', onDragMove);
    btn.addEventListener('pointerup', onDragEnd);
    btn.addEventListener('pointercancel', function(){ endDrag(true); });
  });

  function onDragMove(e){
    if (!drag || !ghost) return;
    ghost.style.left = e.clientX + 'px';
    ghost.style.top = e.clientY + 'px';
    var r = stage.getBoundingClientRect();
    var cx = r.left + r.width/2, cy = r.top + r.height * 0.38;
    zone.classList.toggle('near', Math.hypot(e.clientX - cx, e.clientY - cy) < 118);
  }
  function onDragEnd(e){
    if (!drag || !ghost) return;
    var r = stage.getBoundingClientRect();
    var cx = r.left + r.width/2, cy = r.top + r.height * 0.38;
    var dist = Math.hypot(e.clientX - cx, e.clientY - cy);
    var f = drag.f, isFree = drag.free;
    endDrag(false);

    if (dist >= 118){
      sfx('deny');
      toast('它没接住，东西掉地上了');
      if (lineEl) lineEl.textContent = '投喂失败 · 未扣除';
      return;
    }
    if (!isFree && !spendCoin(f.cost)){ sfx('deny'); return; }  // 理论到不了：按下时已拦过一次
    var td = today();
    if (P.feedDate !== td){ P.feedDate = td; P.feedToday = 0; }
    P.feedToday++;
    S.feedings.push({ t: Date.now(), item: f.n, free: isFree });
    bumped(2);
    save();
    vibe([12,30,12]);
    sfx('feed');
    if (!isFree) sfx('pay');
    fx(f.ic, cx - r.left - 13, cy - r.top - 10);
    var s = pick(f.say);
    say(s);
    comboFeed(cx - r.left, cy - r.top - 30);
    paintFeedNote();
    if (lineEl) lineEl.textContent = f.n + ' 投喂成功' + (isFree ? '（今日免费，剩 ' + (FEED_FREE_DAILY - P.feedToday) + ' 次）' : ' · −' + f.cost + ' 鱼干');
    swapPhoto(pick(['t16','t13','t12','t07']));
  }

  /* --- 连击投喂：短时间连续投喂会累加连击数，触发更强的反馈（抖音礼物那套的手感，但去掉付费） --- */
  var combo = 0, comboTimer = null, lastFeedAt = 0;
  function comboFeed(x, y){
    var now = Date.now();
    combo = (now - lastFeedAt < COMBO_MS) ? combo + 1 : 1;
    lastFeedAt = now;
    clearTimeout(comboTimer);
    comboTimer = setTimeout(function(){ combo = 0; }, COMBO_MS);
    if (combo < 2) return;
    var c = document.createElement('div');
    c.className = 'combo-fx';
    c.textContent = '连击 ×' + combo;
    c.style.left = x + 'px';
    c.style.top = y + 'px';
    stage.appendChild(c);
    setTimeout(function(){ c.remove(); }, 1100);
    if (combo === 5 || combo === 10 || combo === 20){
      sfx('up');
      say(pick(['它吃得眼睛都直了','它有点撑，但还在吃','别喂了，它要胖成球了','它居然开始主动蹭你','它把盘子都舔干净了']));
    }
  }
}
